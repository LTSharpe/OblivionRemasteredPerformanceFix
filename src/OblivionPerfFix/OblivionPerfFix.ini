; OblivionPerfFix settings: 1 = on, 0 = off. You don't need to change anything: the defaults are what we recommend.
; The file has three parts:
; 1. Performance improvements: the game's own work done in a cheaper way; what you see and what happens in the game
;    stay the same. All on.
; 2. Game bug fixes: the game does what it was meant to. On, except three that say why they are off. Set them to 0 to
;    stay closer to the stock game.
; 3. Optional tweaks: they may change the look or how the game plays. All off; switch one on only if you want it.
; After them: Diagnostics (off; nothing you see or play changes) and [General] (the log file).
;
; Each fix checks the game's code before it changes anything. If the code is not what it expects (after a game update,
; for example), that fix stays off and OblivionPerfFix.log says so. The log lists every fix at start-up.
;
; On CPUs with fewer than 8 logical processors, ParallelStaticBodies (with PipelinedBodyCreation), PhysicsPushParallel,
; AnimTeardownParallel and the automatic mode of RdgParallelTranslate stay off, and the log says so: they rely on helper
; threads and were only tested with 16.
;
; "Live" below means you can switch the fix on and off while the game runs (the file is read again every second).
; "Start-up" means it is installed when the game starts: switch it on before starting the game; once installed it can
; be switched off and on live.
;
; How each fix works, in plain words: docs/how-it-works.md on the project page.


[Fixes]

; ###################################################################################################################
; PART 1 OF 3: PERFORMANCE IMPROVEMENTS (all on)
; ###################################################################################################################

; Every fix does the game's own work in a cheaper way: what you see and what happens in the game stay the same. A few
; change only when something happens (for example NpcCreationPacing and ClothBuildDefer build far-away characters'
; parts a few frames later, CellBufferPacedEvict unloads the cells behind you a few frames later), and a few can
; settle an exact tie or a split-second race differently, in ways the game itself already varies (RigTraceReuse,
; ChaosMaxPayloadSize). Each of them says so in its own text below.

; ===================================================================================================================
; Rendering: the CPU side of drawing each frame
; ===================================================================================================================

; Character skeletons (about 7,200 bones a frame) were copied to the graphics card with an instruction that is very
; slow for that kind of memory. This uses a plain copy that writes the same bytes. Start-up only.
BoneUploadStores=1

; The weather and time-of-day system told the engine to rebuild the sun, moon, fog, sky and sky light every frame, even
; when none of their values had changed. This rebuilds them only when something changed. Start-up, then live.
AtmosphereDirtyFilter=1

; When only a light's brightness, colour or temperature changes (sunrise, sunset, weather blends), update it the way the
; engine's own setters do instead of rebuilding it. Needs AtmosphereDirtyFilter. Live.
AtmosphereLightFastPath=1

; The same for the sun's and moon's cloud shadow and cloud brightness values, which the weather moves a little every few
; frames: the new values go straight to the light the renderer draws. Needs AtmosphereLightFastPath. Live.
AtmosphereLightCloudPath=1

; Translate each frame's drawing work into DirectX 12 commands on all CPU cores instead of on one thread, as Unreal
; Engine 5.5 does by default. The biggest gain where the CPU limits your frame rate. Uses 0.4-1 GB more video memory.
; 2 = automatic: on, except on graphics cards with less than 9.5 GB of video memory (8 GB cards), where video memory is
; the limit and this made travelling less smooth in our tests. 1 = always on, 0 = off. Live.
RdgParallelTranslate=2

; With RdgParallelTranslate the frame reaches the graphics card in about 100 small pieces, each with a small cost. This
; hands over up to this many pieces at once, in the same order (the engine's own batching). 0 = off. Start-up, then live.
RdgSubmitBatch=32

; When a big area streams in (a wood, a rock field), the positions of its new objects are written into the graphics
; card's scene data. Unreal splits that into batches but ran them one after another on one helper thread, and the frame
; waited for it (up to about 50 ms). This runs them on all helper threads (Unreal's own r.GPUScene.ParallelUpdate, on by
; default in later versions). Each batch writes its own part, so the result is identical. Live.
GpuSceneParallelUpload=1

; Robes, capes and banners copied their whole cloth simulation setup every frame, although it almost never changes. This
; skips the copy when it would come out identical. Start-up, then live.
ClothConfigCache=1

; Lakes and rivers: whenever an area with land or water streams in or out near a lake or river (often several times a
; second while riding), the game redraws that water's "water info" picture (ground height and water depth seen from
; above) with three small extra renders on the render thread, which then often made a frame wait. The next four keys
; take out work inside those small renders that changes no pixel, in the game or in the water picture. They are
; installed when the game starts, then live.
; - Each small render made FSR re-create its full-screen copy texture at the tiny render's size, and the next frame
;   re-create it at full size again; FSR never uses that copy for these renders. This leaves FSR out of them.
WaterCaptureFsrSkip=1
; - Each small render waited for the graphics driver thread to catch up, as the first render of a frame does. The game's
;   main render still does that once every frame. This leaves the extra wait out of the small renders.
WaterCaptureNoRhiFlush=1
; - Each small render also waited for the previous render's visibility tests to be sent to the graphics card, although
;   these renders never read such results. This leaves that wait out of them; the main view still waits as before.
WaterCaptureNoOcclusionWait=1
; - Each small render looked through every object in the scene (thousands of them) to switch on the few water
;   meshes it draws. This finds the same meshes, in the same order, from the scene's compact list of object ids.
WaterCaptureFastMeshScan=1
; - Opening or closing a menu, or saving, makes the game redraw the water picture of every loaded lake and river (8 at
;   once, 20-40 ms of the render thread), although nothing in them changed. This skips a redraw whose inputs (the water,
;   the ground pieces, their positions and sizes, the picture's height) are exactly those of that water's last redraw,
;   so the picture stays as it was drawn. Equivalent rather than identical: content the inputs can't show (finer ground
;   detail streamed in since) is refreshed at the next real change instead of at the next menu. Start-up, then live.
WaterInfoSkip=1
; - While you travel, the game often asks for several of those water pictures in the same frame or a few frames apart
;   (each 5 ms or more of the render thread at 4K). This draws at most one per frame, oldest first (1), and lets a water
;   that was just redrawn wait out a quarter of a second so the requests in between become one redraw (2); 3 = both.
;   Every redraw still happens, with the ground and water of the moment it is drawn, at most 4 frames or a quarter of a
;   second after it was asked for. Equivalent rather than identical: a lake's water picture can follow a change of the
;   ground around it that much later. 0 = off. Start-up, then live.
WaterInfoSpread=3
; - Water this close to you, in metres, is never made to wait (0 = only the water you are in; -1 = none). Live.
WaterInfoSpreadNearM=-1
; - When you cross into new cells, the game asks for the same lake's or river's water picture again and again: once for
;   the cells left behind, then again as each new cell is added, a few frames to a third of a second apart, and once in
;   the very frame that is already busy removing cells. This waits while cells are still being added or removed and then
;   draws that water once, in the calm frames after the crossing, with the ground and water of that moment (one per frame
;   as above). The number is the longest wait in milliseconds from the first request (500, the default since 1.6.0);
;   the pictures in between are left out, so water near newly added ground may show its shore up to that much later.
;   Nothing waits behind a loading screen or for water that follows the camera. Uses the cell hooks of
;   StreamOutEndPlaySlice and the add hook of StreamRegisterGranularity or StreamInBudget (without the add hook, from
;   either key, nothing waits). 0 = each request drawn as the game does (also the way back). Start-up (0 here and
;   WaterInfoSpread=0: not installed), then live.
WaterInfoAfterCrossing=500

; With ray tracing on, every newly loaded object gets its own ray-tracing structure. The game built each one on its
; own the moment the object was set up, and the graphics card finished one before it started the next: a quarter of a
; millisecond each, however small the object. When a hundred or more objects arrive at once (an area streaming in, new
; characters), that frame took 20-40 ms longer on the graphics card. This builds them all together at the start of
; that same frame, before anything uses them: the same structures in the same frame, so the same picture. Installed
; when the game starts, then live.
RayTracingBuildBatch=1

; Lumen (the game's global lighting) keeps a table on the graphics card that says which of its "cards" belong to each
; object instance. When one tree of a big forest object gets or loses its cards, the game sent the whole object's table
; again, every instance of it, every frame something changed: about 0.8 ms of the render thread per frame on a ride. This
; sends only the instances whose entry changed; the table on the graphics card ends up with the same values in the
; same frame (checked against the game's own values: no difference in 272 million instances). Installed when the game
; starts, then live.
LumenCardsNarrow=1

; Every frame, Lumen also checks on the processor whether each object in the world should get or lose its cards:
; about two million entries in the open world (each tree of a forest is one), read one by one on the game's helper
; threads: 37-44 ms of processor time per frame summed over them on our `bravil-road` run (a first measurement: one run; it depends on the place), against
; 3.0-3.7 ms with this fix; and it pushes what the other threads need out of the processor's caches. Unreal Engine
; 5.6 (Epic) skips entries that cannot change anything before reading them; this does the same for the game's engine
; version: it remembers, for each run of 64 entries, where their objects are and whether any could get or lose cards,
; and reads a run again only when the camera comes near enough, the settings change, or the game changes one of its
; entries. The game gets the same requests in the same order as without it: only work whose result is unchanged is
; skipped (check mode 2 found 0 differing results in more than 170 million checked tasks); screenshots match the stock
; game within run-to-run variation at six of seven test views; at the seventh, a close-up in shadow, they differ, traced
; to our test camera (it settles a fraction of a centimetre differently after each teleport), not to the fix; we found no
; difference attributable to the fix (we do not claim identical pictures). The idea is Epic's (Unreal Engine 5.6.0), written here for the game's engine. 1 = on (default), 0 = off (also while the game
; runs), 2 = check mode (both ways run and are compared, the game gets its own result, any difference is named in the
; log; slow, for testing only). Installed when the game starts, then live; to have it not
; installed at all, set 0 before starting the game.
LumenScanCull=1

; ===================================================================================================================
; Horses and collision checks: work the game repeats every frame
; ===================================================================================================================

; Characters, creatures and horses each have a "physical animation" part that the game updated every frame under the
; physics world's exclusive lock, even when it had nothing to move (in our tests it never had). Next to horses, whose
; animation reads the physics world on other threads at the same time, the game's main thread waited for that lock
; up to about 1 ms a frame. With nothing to move and no animation step waiting, this skips the update: the skipped code
; changes nothing. Start-up, then live.
PhysAnimNoEmptyLock=1

; A horse checks the ground under its hooves about 106 times a frame, and about 9 in 10 of those checks repeat one it
; made a moment earlier in the same animation step, with exactly the same position, size and direction. This gives such
; a repeat the earlier check's answer. It could only differ if something moved in those microseconds on another thread,
; a race the game itself leaves to chance; in our tests (2.6 million repeats, standing, riding, and with a fight among
; the horses) it never did. 2 = check only (every check runs; differences are counted in the log). Start-up, then live.
RigTraceReuse=1

; Five times a second every character checks whether it can see each character near it: up to three sight lines per
; pair, one after the other on the game's main thread. In a crowd or a battle that is the largest single cost of that
; thread. This works out a round's sight lines on helper threads at the start of the round, then hands each answer to
; the game's own loop when it asks, in its own order; nothing the round does in between can move anyone or change what a
; sight line sees. Contributed by bpodwinski (PR #55). Measured by its contributor on one PC (5800X3D, RTX 5080), 4K
; with FSR Performance: the main thread's work per frame 60 -> 41 ms in a 76-character battle (14 -> 20 fps),
; 19.5 -> 17.8 ms in a 40-soldier crowd; 0 differences in over a million checked sight lines (ours: over
; 450,000). 1 = on, 2 = check only (the game's own check runs too;
; differences are counted in the log). Start-up, then live. Not on PCs with fewer than 8 usable logical processors.
PerceptionLosPrefetch=1

; Every collision check in the game (walking, characters, horses, sight lines, falling objects) first went through a
; list of about 730 very large shapes spread over the whole map (most of them 1.6 km tall columns), one by one, before
; it looked at what is actually nearby. This files those shapes in the physics world's search tree with everything else
; (the engine's own setting p.MaxPayloadSize, in centimetres: the game's is 100000), so a check only looks near itself.
; Every check finds the same objects; only the order in which they are looked at changes, which can settle an exact
; tie differently (as the tree's shape already does in the game). A p.MaxPayloadSize line of your own in Engine.ini
; wins. 0 = the game's value. Start-up only.
ChaosMaxPayloadSize=10000000

; The game simulates loose objects and ragdolls in physics steps of at most 20 ms: a frame that takes longer than 20 ms
; gets a second step right after the first, and the game waits for both before the frame goes on (about 2 ms more).
; With riders, creatures or a fight around, one frame just over 20 ms then makes the next one slow too, and slow frames
; come in runs (on our 4K test rides along the east road past riders and creatures: frames over 28 ms 25 and 29 in two
; stock rides, 11 and 14 with steps of up to 33 ms; two rides each, a first measurement; on our Imperial City flight no
; difference we could measure). 1 = steps of up to 30 ms, at most 4 of them (the
; engine's physics settings MaxSubstepDeltaTime 0.03 and MaxSubsteps 4, the same as these two lines under
; [/Script/Engine.PhysicsSettings] in Engine.ini): one step up to 30 ms, two up to 60 ms; the longest stretch one
; frame simulates stays 120 ms, as in the game. Frames of up to 20 ms (nearly all at a 60 fps cap) are not changed.
; Not bit for bit: in a frame of 20-30 ms a falling object or a ragdoll is moved in one step instead of two half steps
; (a coarser step of the same motion; also characters' physically simulated parts, such as hit reactions; walking and
; riding use their own movement code and are not affected).
; Your own MaxSubstepDeltaTime or MaxSubsteps line in Engine.ini wins over this. 0 = the game's steps. Start-up, then
; live (from the next area that loads in) if the hook it shares was installed at start-up: this key,
; StreamRegisterGranularity or StreamInBudget on (the last two are on by default).
PhysicsSubstepCap=1

; ===================================================================================================================
; Travelling: memory that was handed back and requested again every time the world streams in or out
; ===================================================================================================================

; Lumen (the game's lighting) keeps a list of every object it lights. When an area streamed out, the game shrank the
; list, copying it to new memory, and grew it again with another full copy when the next area came in (25-40 ms each
; time). This keeps the list's memory (only what it already needed at its largest). Start-up, then live.
LumenKeepArrayCapacity=1

; Part of LumenKeepArrayCapacity: that list has one entry per tree and grass instance (1 to 2.4 million outdoors). In the
; first outdoor area of a session it grew in many steps, and the last steps copied 50-100 MB at once while the frame
; waited (20-63 ms, a visible hitch). This gives it room for this many entries in one step, while it is still small
; (80 bytes each: 198 MiB set aside for 2600000, taking RAM only as the list fills). Only while Windows has that much
; commit (RAM plus page file) available without growing the page file, and 2 GB more to spare; otherwise, and with 0,
; the list grows step by step as before. Live.
LumenGroupsPrior=2600000

; Textures and meshes reach the graphics card through "upload" memory, which the game handed back to Windows after each
; streaming burst and requested again seconds later (up to 30 ms per block). This keeps it for the session. Costs a
; little memory (0.1-0.5 GB), not growing over time: video memory on our AMD test card (the driver
; puts upload memory there for Unreal Engine 5 games), other cards may differ (not tested). Start-up, then live.
UploadMemoryKeep=1

; The graphics card's list of every object, tree and grass instance in view (100-250 MB in a forest) was re-made with a
; fresh block of memory each time its size crossed a power of two, in either direction (about 100 ms). This keeps its
; size when the count drops by one step and only shrinks it at a quarter. Live.
GpuSceneKeepCapacity=1

; That list grows from 96 to 192 MB once in most sessions, on a first ride through new places; making the new block
; waits on the graphics driver (median 5 ms, up to 24 ms: a hitch, sometimes in play). 1 = the first time it needs 96 MB
; (mostly while a load ends) it is made 192 MB at once, so the later step does not happen in play. Only on cards with
; 16 GB or more (Windows' video memory budget for the game at least 14000 MB, with 1 GB of it free, at that moment;
; decided once per session). Costs up to 96 MB of video memory in a session that would have stayed at 96 MB. The
; picture is the same. Needs GpuSceneKeepCapacity. Start-up only.
InstanceBufferFloor=1

; With ray tracing on, the graphics card's list of everything in the ray-traced scene was moved to a new, smaller block
; of video memory whenever the scene needed less than half of its block, and to a bigger one again when it grew back.
; Riding through the world that happened at the same places every time, and with video memory nearly full (4K) each new
; block made the game wait while Windows made room: a freeze of a fraction of a second. This keeps the block when it is
; big enough (at most the largest size this session already needed); it still grows as before. The picture is the same.
; 1 = on, 2 = installed but off (the game's way), 0 = off. Start-up, then live.
RtSceneBufferKeep=1

; Textures streamed in and new buffers are placed in big blocks of video memory (64 MB for textures, 32 MB for buffers).
; The game destroys a block a third of a second after it went empty and makes a new one at the next burst, which on a ride
; happens every few seconds; making one waits for Windows (1-9 ms on the render thread, once 17 ms on a streaming thread
; with the render thread queued behind it: a stutter at an Imperial City bridge). This keeps empty blocks, the most
; recently used first, up to this many MB in all, so the next burst reuses them; above that, when Windows runs short of
; memory, or when video memory plus this number would pass what Windows gives the game, they are given back one at a
; time, never more at once than the game would. The picture is the same.
; Any number from 1 to 4096 works (a value outside 0..4096 is clamped, and the log says so). How much is enough: in
; our rides the empty blocks wanted 128-576 MB at once (usually under 384; over 448 only in the busiest bursts, over 512 in
; 0.1 % of the checks). 384 is the suggested size: it covers the whole of a calm ride and 80-90 % of the busiest ones;
; 256 gives some blocks back that the next burst needs, more than 512 only costs video memory. The log line shows
; "given back": 0 means the number is enough. 0 = as the game. Start-up (0 = not installed), then the number is live.
GpuPoolKeepMB=384

; The graphics card's small "indirect argument" buffers (the lists that tell it how much to draw, written by the card
; itself) were each made as a separate block of video memory, each one a call into the graphics driver on the render
; thread: hundreds on a ride (401 on the road to Bravil). 1 = they come from the engine's shared buffer memory like every
; other buffer, as Unreal Engine does by default since 5.5 (its own setting d3d12.AllowPoolAllocateIndirectArgBuffers).
; Less work on the render thread, a small gain. Where they sit in memory is all that changes; the picture is the same. A
; line for that setting in your own Engine.ini still wins. On by default (0 = off). Start-up only.
IndirectArgBufferPool=1

; Everything the game brings in while you travel (pieces of the world, textures, detailed geometry) is read from its big
; container file by one reader that takes one block, waits until it has been read, and only then takes the next. When
; many blocks are wanted at the same moment they wait behind each other, however fast the drive is. One case you can
; see: when a new area first uses its textures, the game waits for a few dozen blocks before it draws the frame, and
; that frame takes about twice as long: a hitch at the same place on the first visit in every session (at the waterfall
; on the road to Bravil about 31 ms instead of the usual 17). With a number here, up to that many blocks are read at the
; same time. The same data arrives, only sooner: that frame took about 25 ms in our tests, and a block of a world piece
; waited half as long. 8 is what we tested (16 was no better). 0 or 1 = the game's own reader. On a hard disk the game's
; own reader is kept (the log says so). On by default (0 = the game's reader). Switching it on takes a restart; after that
; the number can be changed while the game runs.
ParallelFileReads=8

; Nanite (the game's detailed geometry) keeps its streamed pieces in one big block of video memory (about 0.6 GB). The
; first time a session needs more than the block's starting size it makes a new, bigger block beside the old one and
; copies everything over in one frame; with video memory nearly full (4K) that froze the game for up to about 1.7
; seconds, at the same place each time (past the Talos bridge on the Imperial City flight). This makes the block start
; at the size of that first step, so the step is never taken; later steps work as before. Uses 32 MB more video memory
; from the first area on (4096 = the next step as well, 64 MB). It is the same as the line
; r.Nanite.Streaming.NumInitialRootPages=3072 under [SystemSettings] in Engine.ini; such a line in your own Engine.ini
; still wins. 0 = the game's size (2048). Start-up only.
NaniteInitialRootPages=3072

; Clearing a big patch of grass or plants built its list of "hide" orders a little at a time, so the list was copied
; about 30 times in one frame (about 20 ms). This makes room for the whole list once. Start-up, then live.
InstanceClearReserve=1

; The game's memory manager handed blocks back to Windows and asked for new ones about 1,700 times a second in a town;
; each new block costs a page fault on every first write. This keeps up to 64 MB of returned blocks and hands them out
; again for the same size. Unused blocks go back to Windows after 5 seconds, and at once while Windows is short of
; memory (see MemoryRelief). Start-up, then live.
OsPageCache=1

; Handing large blocks back to Windows takes the game's main thread time, and the clean-up after the game's garbage
; collection hands back many at once (on the road to Bravil these calls added up to several milliseconds in one frame).
; With this on, most of the blocks OsPageCache does not keep are handed back by one background thread instead, in the same
; order; Windows keeps them reserved until then, so nothing else can be placed there. At most 4,096 blocks or 64 MB wait
; at a time (beyond that a block is handed back at once, as the game does), and while Windows is low on RAM or commit
; every block is handed back at once. All of them go at once when the memory manager's request to Windows fails, while
; Windows is short of memory (see MemoryRelief), and when this or OsPageCache is switched off. Needs OsPageCache. Live.
OsPageCacheAsyncRelease=1

; While the world streams in, the game builds the map its characters walk on (the navigation mesh) in the background,
; tile by tile. A thread that was waiting for something else could pick up such a tile while the frame waited for that
; thread (up to about 100 ms). This leaves the tiles to free threads (the engine's own flag for that). Live.
NavmeshBuildNoBusyWait=1

; The engine's check behind NavmeshBuildNoBusyWait has a gap: a waiting thread that puts one such tile back can take the
; next one without checking it (0.1-2.5 s waits seen over the Imperial City). This closes the gap. Live.
BusyWaitFlagCheck=1

; When a piece of that navigation map streams in, the game links its tiles to the tiles around them, in one frame. For
; every pair of neighbouring tiles it looked through all the polygons of the other tile, also for the many pairs that
; have no border between them at all. This skips the pairs that cannot be linked and looks only at the polygons that lie
; on the shared border. The game's own code makes every link: the same links in the same order. Installed when the game
; starts, then live.
NavLinkFast=1

; Every frame the game hands its characters' queued path searches to one background task and, later in the same frame,
; waits for it. The engine runs that task at background priority (Epic's setting
; TaskGraph.TaskPriorities.NavTriggerAsyncQueries, "bnn"), so it can only run on the background threads (11 on a 16-thread
; CPU), and while the world is busy those are all inside ray-tracing pipeline builds of 20-200 ms each: the task waits in
; line, the game with it (on our flights along the public showcase route over the Imperial City waterfront, frames of
; 116 and 161 ms in 2 of 2 stock runs; none of those with this on; a path search itself takes 1-10 ms). 1 = sets Epic's
; setting to "nnn" (normal priority) so idle normal threads take the task at once. The same task, the same searches in
; the same order, the same waiting before the game uses the results: only the thread that runs the task changes (the task
; may get through more searches before the game asks it to stop, so results arrive the same frame or earlier). Your own
; TaskGraph.TaskPriorities.NavTriggerAsyncQueries line in Engine.ini or the console wins over this. 0 = the game's
; setting. Start-up, then live (from the next area that loads in) if the hook it shares was installed at start-up: this
; key, StreamRegisterGranularity or StreamInBudget on (the last two are on by default).
NavQueryPriority=1

; ===================================================================================================================
; Travelling: physics, when a new area arrives
; ===================================================================================================================

; The physics engine keeps a search tree of every solid object. When a whole new area arrived at once it rebuilt the
; tree in one go while the game waited (about 30 ms). This spreads those rebuilds over a few frames like the small ones,
; and lets each step do more of the work in the background while a rebuild has a backlog. Collisions find exactly the
; same objects meanwhile. Live.
PhysicsTreeTimeSlicing=1

; When a rebuild finishes, the objects that arrived meanwhile are added to the tree's two copies (one for physics, one
; for the game's own checks). This fills both copies at the same time on two threads. Live.
PhysicsFlushParallel=1

; Woods and rocky slopes are made of "instanced" meshes; each tree or rock gets its own collision body when the area
; streams in, a few hundred at once on the game's main thread (about 170 ms over a few seconds below Kvatch's north
; cliff). This makes those bodies on a few helper threads with the game's own code and hands them to the physics world
; in the game's order. Start-up, then live.
ParallelStaticBodies=1

; Hands each group of 64 bodies to the physics world while the helper threads are still making the next ones, instead
; of waiting for all of them. The same bodies in the same order, in the same frame. Needs ParallelStaticBodies. Live.
PipelinedBodyCreation=1

; New collision first goes into a small "recent changes" search tree until the next background rebuild. The game picked
; each new entry's place with a thorough search over the whole tree; this uses the usual quick rule. The same entries
; with the same sizes, so every collision test finds the same things; only the tree's shape differs, which the game
; itself already varies from run to run, and only until the next rebuild. Start-up, then live.
DirtyTreeQuickInsert=1

; Files a whole batch of such new entries as one branch of that tree, arranged into a balanced shape at the end of the
; batch, instead of one entry at a time with a pass up the whole tree for each. Same entries, same sizes (the shape
; differs as above). Start-up, then live.
BulkIndexInsert=1

; In a physics step that swaps in a rebuilt search tree, two catch-up passes that work on different trees ran one after
; the other; this runs them side by side. Same results. Start-up, then live.
PhysicsInternalFlushParallel=1

; When a forest or a town streams in, the physics side takes in thousands of new bodies one at a time on one thread.
; This creates each batch in one go and sets up their shapes on a few helper threads, filed in the same order.
; 1 = on, 2 = batch creation only, 0 = off. Start-up, then live.
PhysicsPushParallel=1

; When the main thread takes over the physics side's newest search tree, it works through its list of collision
; changes; the game shrank and copied that list after every ~228 entries (dozens of copies when a forest streams in).
; This shrinks it once, at the end. The same changes in the same order. Start-up, then live.
PhysicsQueueShrinkOnce=1

; When the cells behind you unload, their rock and tree fields leave the physics world: up to 2,500 collision bodies in
; one frame, which the physics step then takes apart one by one while the main thread waits for it. This deletes those
; bodies' leftover objects on one helper thread while the step goes on (all of them before the step ends) and rebuilds
; the physics lists' indexes once at the end instead of after every body. The physics world afterwards is the same.
; Only for 256 or more bodies at once; the helper only with 8 or more logical processors. 3 = both parts, 2 = the
; single rebuild only, 1 = the helper only, 4 = installed but off, 0 = off. Start-up, then live.
PhysicsDestroyBatch=3

; When the cells behind you leave the world, their rock and tree fields' collision bodies (7,000-26,000 at one place
; on the Bravil and Kvatch roads) were removed in a few frames, and the physics step then took them apart while the
; main thread waited (frames of up to about 40 ms). 1 = they are removed over the next frames instead: at least 500
; a frame, each one within 30 frames (half a second at 60 fps), at the end of a frame as the game would. Only bodies
; of cells at least 50 m from you, and only while you play (loading screens stay as they were). Nothing you see
; changes; the difference is that for up to half a second those far, out-of-reach bodies are still in the physics
; world. Needs NpcCreationPacing. 0 = the game's way. Start-up, then live.
BodyRemovalSpread=1

; When new cells stream in, the game adds their objects to the world a few milliseconds per frame, but it checks the
; time only after every 10 objects, and on a wooded slope 4-5 of those 10 can be grass or rock fields with ~1,000
; collision bodies each: one 9-14 ms piece of work, then a slow physics step (frames of about 44 ms). 1 = the time is
; checked after every object (the engine's own setting s.LevelStreamingComponentsRegistrationGranularity, while you
; play; loading screens keep the game's 10). The same objects in the same order; a newly streamed-in cell appears about
; 0.1-0.3 s later than in the game (as it does in the game at about 40 fps). 2-9 = in between, 0 = the game's 10. If
; your Engine.ini or the console sets that variable, yours is kept. Start-up, then live.
StreamRegisterGranularity=1

; When a new row of cells streams in (riding across the land), the game spends up to 4 ms per frame adding the cells'
; objects to the world and up to 5 ms reading their files; with both in one frame on top of the frame's own work, the
; frame can take 25-29 ms (Memorial Cave on the east road; ours). This lowers the engine's own two budgets while you play
; (s.AdaptiveAddToWorld.AddToWorldTimeSliceMax and s.AsyncLoadingTimeLimit): 1 = 1 ms and 3 ms (the burst's slowest
; frame 28.8 -> 22.4 ms in our runs), 2 = 2 ms and 3 ms (22.6 ms). The same work in the same order, spread over more
; frames: far cells finish up to about 0.8 s later with 1 (0.15 s with 2). Loading screens keep the game's budgets. If your
; Engine.ini or the console sets either variable, yours is kept. 0 = the game's budgets. Start-up, then live (0-2).
StreamInBudget=1

; Engine behaviour (also without this mod; changed by Epic in Unreal Engine 5.6, off there by default): when a cell
; behind you leaves the world, the engine tells every object of that cell that it is leaving, all in one frame, after
; taking its parts out over a few frames. In this game each object then unhooks itself from lists the whole world
; shares, which takes longer the more is loaded: one frame of 4-14 ms per cell on a ride (3 of the 9 slowest frames of
; a 15-minute ride, ours). N = that last step goes N objects at a time within the engine's own time limit of 1 ms per
; frame, over the next frames, as Unreal Engine 5.6 can do it (its s.LevelStreamingRouteActorEndPlayForRemoveFromWorld-
; Granularity). The same objects in the same order; the cell, already hidden, leaves the world's list a few frames later.
; Loading screens: all in one frame as before. 0 = the game's way. Start-up, then live.
StreamOutEndPlaySlice=4

; When a cell is added to the world, the game sets up each object placed in it (plants, rocks, chests, doors, clutter)
; in one step, and inside that step switches each object's collision setting four times and back to where it started.
; After every switch the engine asked the physics scene what the object now touches: four full checks per object where
; only the last one counts, and most of these set-ups' time goes to those checks. With 1 an object that touches nothing
; when the step begins is checked once, at the end of the step, with its final setting, the way Unreal Engine itself
; checks once at the end of a grouped move (UE 5.3, FScopedMovementUpdate). An object that already touches something is
; checked after every switch, as before. The result is the same (what each object touches afterwards); what disappears
; is only the notices for things an object touched for a moment in the middle of the step, and none of the game's
; listeners we read acts on those for placed objects. In our test rides the set-ups took 13 to 33 % less time; we
; measured no change in frame rate. 0 = the game's way. Start-up, then live.
FlowOverlapsOnce=1

; ===================================================================================================================
; Travelling: characters
; ===================================================================================================================

; Every character that appears (arriving in a town, stepping out of a door) fades in over about a second. During the fade
; the game rebuilt every piece of that character for the graphics card on every frame (body, clothes and equipment, each
; with a new ray tracing copy). Where many characters appear at once, as on Anvil's docks, that took more than a gigabyte
; of extra video memory, and when it went over the card's budget the game froze for seconds. This sends just the changed
; fade value to the graphics card, the way the engine updates other per-object values. The fade looks the same.
; Start-up, then live.
NpcFadeInNoRebuild=1

; When a new strip of land loads, the game created every character in it at once (a shrine with five worshippers:
; clothes, hair, weapons, animation) in one or two frames: 50-100 ms hitches. This builds the far-away ones (more than a
; cell from you, and out of sight) a piece per frame, so they are complete a few frames later out there. Anyone near
; you, and everything during loading screens and menus, is created exactly as before, in the same order; nothing is
; skipped. While a character waits, the game's updates behind it wait too (usually a few frames, never more than 30),
; as they would during the long frame it replaces. Since 1.2.3 a far character in your view that is still invisible in
; its fade-in (the first part of it, before it can be seen) counts as out of sight too, so it is no longer built all at
; once while nobody can see it (PacingFadeAware=0 in this section turns that part off). If you ever see the game freeze
; while travelling, set this to 0 and please report it. Start-up, then live.
NpcCreationPacing=1

; Part of NpcCreationPacing. When a newly loaded area's own characters are set up while far-away characters are still
; waiting, the waiting characters are created first, as in the game. Their clothes, hair and body updates (which in the
; game come after the area's set-up anyway) no longer all run in that same frame: they go on a piece per frame, as the
; rest of the pacing does. Timing only, in the game's order. Live.
PacingLeanFlowDrain=1

; Part of NpcCreationPacing (written by mkusm, pull request #25). A far-away character's equipment and hair steps now
; wait their turn like its other steps when it is out of view; before, a small object between the step and its
; character (the body's equipment part) made the step count as near, so it ran at once. Timing only. Live.
PacingOwnerWalk=1

; Part of NpcCreationPacing (fixes our own bug, there since 1.0.0-beta). A character's hair step could not be matched to
; its character (the step belongs to the hair's model file, not to the character), so it always counted as near: behind
; far-away characters waiting their turn it waited too, and then ran at once, many in one frame (14 hair steps after a
; row of far characters at the Imperial City Waterfront, on top of a character's other steps: a 43 ms frame). With 1
; the hair step is matched to its character through the hair it puts on and waits or runs like that character's other
; steps; a step finishing inside another step of the same character also waits as that character's. Once a waiting
; character starts to fade in (it shows half a second later), its steps and the ones queued before it run at the pace
; that normally finishes them before it shows, but never more than 2 steps in one frame, and besides the first step
; about 16 ms of them (a very deep queue of large steps can still finish a little after it begins to show). Timing only, in the game's order. Live.
PacingHairActor=1

; Part of NpcCreationPacing (fixes our own gap, there since 1.0.0-beta). When a newly loaded area's set-up waits for
; far-away characters still owed to it, it waits up to eight frames while one of them is created in every frame, else
; three. Two cases counted as no progress, so after three frames the rest was created at once, in one frame: characters
; still owed from earlier frames (two in one frame, 15-24 ms, Imperial City Waterfront), and a character waiting for
; its files to load (CreatePreload, far or a near one out of view; created with the load still running: the game waited
; 24-28 ms for the disk). With 1 both count as progress, still at most eight frames; the world logic pauses for those
; frames as it already did, now for up to eight frames (stock: one long frame of about 40-60 ms there). Timing only, in
; the game's order. Live.
PacingFlowProgress=1

; Part of NpcCreationPacing (improves our own pacing, there since 1.0.0-beta). A far-away character's body, clothes and
; hair steps (7-14 ms each) waited for the frame's time budget only, which is decided before the frame's own work is
; known: so one landed on a frame that was already slow (16-26 ms while new characters arrive), and the frame took
; 25-36 ms, a visible drop (Imperial City Waterfront). With this on, each waiting step is decided on its own. A step of a
; character that is at least PacingGateNearM away and either out of sight or still at the faint first stage of its
; fade-in (where the game holds far characters) runs only after the frame's world update, and only if the frame then
; stays within the target (time so far + what the rest of the frame took lately + the step's size), or on a calm frame
; (one whose own time stays below PacingGateCalmMs; one step a frame, so such a frame can go over the target); at most
; one large step a frame, oldest first. No step waits longer than PacingGateBoundFrames: before that limit the waiting steps
; run anyway at the slowest even pace that keeps each one within it, so the limit never releases a pile at once. Once a
; waiting character comes near, or its fade-in goes on past that first stage, its steps run as without this key, ahead
; of the far ones; nothing waits during loading screens and menus. So a far character may be finished up to
; PacingGateBoundFrames later than without the gate, and one drawn at that faint first stage shows it that much longer.
; 1 = on with a 25 ms target, 18-50 = on with that target in ms, 0 = off. Timing only (our own steps; each character's
; steps keep the game's order). Live.
PacingBaseGate=25
; With PacingBaseGate on: a waiting far step runs at the latest this many frames after it was queued (10-180; 45 frames
; are 0.75 s at 60 fps, 1.5 s at 30 fps). Lowering it while playing lets the steps already past the new limit run one per
; frame. Live.
PacingGateBoundFrames=45
; With PacingBaseGate on: a waiting far step may also run on a frame whose own time stays below this many ms, whatever
; its size (one a frame; 10-30, 0 = never). Live.
PacingGateCalmMs=17
; With PacingBaseGate on: a character nearer than this many metres never waits for room (0-500). Live.
PacingGateNearM=100
; With PacingBaseGate on. While a far character's body or clothes step waits for room, that character's fade-in already
; runs, so its unfinished body can start to show faintly (with this key at 0), and the steps that the end of its fade-in
; forces out land on slow frames. With a number here (the most milliseconds to hold), such a character stays fully faded
; out, as in the first frame of every fade-in, until its waiting steps have run (or for this many ms at most), then fades
; in a little faster (up to about 3 times when the hold lasted its full window) so that it is fully visible exactly when
; the game's own fade-in ends; its waiting steps are run before then, one a frame (a few a frame only when one a frame
; cannot make it, at low frame rates). Only far characters (PacingGateNearM) that have not started to show are held,
; never one already visible. What changes is when such a character becomes visible: later in its fade-in (up to about
; 0.9 s), then faster. Its fade-in itself, its AI and what the game reads are the game's. If such a character's weapon
; or shield was made before its body, its body is usually made within about 0.1-0.2 s (at most until the hold ends,
; under a second), and until then the weapon can show without the body. 1000 is what we tested and recommend;
; 0 = off. On by default. Switching it on takes a restart; after that the number can be changed while the game runs.
PacingGateShownHoldMs=1000
; With PacingGateShownHoldMs on: by which point of the fade-in a held character's waiting steps must have run, in tenths
; of the game's fade (it goes from 50 to 0, 40 per second; 10 = the last quarter second); the hold ends 5 tenths before
; that at the latest. 10 is what we tested and recommend (5-25). Live.
PacingGateShownHoldEnd=10

; Part of NpcCreationPacing (the engine's behaviour, also without OblivionPerfFix; the idea is Epic's, Unreal Engine 5.5).
; A new character drawn in its first frames, before the engine knows whether it is hidden behind something, counts as
; "seen" for a whole second, so a far crowd arriving behind buildings animates at full rate for that second although
; nobody can see it (the Imperial City Waterfront: up to 15 animation updates a frame instead of 4). With 1, a far
; character that is still fading in and has not been drawn for 0.2 s no longer counts as seen, as any hidden character
; in the game after its first second; a character that is drawn keeps animating exactly as before. Its animation then
; starts when it is first seen. Equivalent, not identical: such a character's pose at first sight can differ from the
; game's. Live after a start with 1 (start-up install).
FadeInUnseen=1

; Part of NpcCreationPacing. Creating a far-away character or creature whose model or kind is not loaded yet (the first
; horse, rat or skeleton of a trip, or one the game unloaded since) made the game wait for the disk: 10-60 ms, up to
; 160 ms next to a ruin. Such a character now waits at the head of the queue while the same files load in the
; background, then is created as before; it waits at most as long as NpcCreationPacing lets it (PacingMaxLagFrames),
; then the game loads the rest itself. Timing only (a few frames, far away). Start-up, then live.
CreatePreload=1
; With CreatePreload=1, a character created near you may also wait, at most this many frames (0-30), while the spot is
; well out of the camera's view (more than 75 degrees off where it looks); it is created at once when the spot comes into
; view. Uses frame generation's camera, so without frame generation it never waits. 0 = off. Live.
CreatePreloadNear=12
; Part of CreatePreload (fixes our own gap, there since 1.3.0-beta). A far-away character held back for the frame's time
; budget asked for its files only once it was its turn to be created, a frame or more later; if the game then needed it
; at once (an area's set-up waiting for it), it could be created with its files still loading and the game would wait
; for the disk in that frame. With 1 its files are asked for as soon as it is held back: a head start of a frame or more
; (no gain we could measure on its own; the Waterfront's waits were removed by PacingFlowProgress). Timing only. Live.
CreatePreloadEarly=1
; Game behaviour (also without this mod): the first weapon hit on each kind of surface in a session (metal, cloth, stone, ...)
; made the game load that hit's effect and the blood effect from disk while you waited: a freeze at the
; start of a fight (65 ms of an 84 ms frame near Mortal Camp, ours). With 1 the game's own list of these effects (every
; surface) is loaded in the background as soon as the game's settings exist (at the main menu) and kept loaded, so the
; hit shows the same effect without the wait. Costs some memory for the session. Needs NpcCreationPacing. Start-up,
; then live (0 stops asking for more; what is loaded stays loaded; 2 only logs the first hit of each surface).
ImpactPreload=1
; Engine behaviour (also without this mod; fixed by Epic in Unreal Engine 5.4): renaming an object made the game wait
; until every file it was loading in the background had finished, although the rename needs none of them (drawing a bow
; renames the arrow you nock: a freeze of up to about 20 ms when something was loading, ours). With 1 the rename waits
; only when the object's package has an old-style loader attached, as in Unreal Engine 5.4 (this game's packages have
; none). The background loads finish as they would anyway. 0 = the game's way. Start-up, then live.
ResetLoadersNoFlush=1
; Engine behaviour (also without this mod): about once a minute the engine runs a garbage-collection pass on a timer
; (7-17 ms on the game thread, ours), whatever else that frame is doing; when it lands on a frame where a cell is being
; added to or removed from the world, characters are being set up, or the frame is already slow, the two add up to a
; sudden drop. With a value the due pass waits, frame by frame, with the engine's own one-frame delay, for the first
; calm frame, at most this long: 1 = 500 ms, or 100-1000 ms. The same pass runs; only its moment moves, by at most the
; bound, and a later pass also collects what became garbage in the wait (the next pass follows the usual interval after
; this one). Busy = a cell added or removed in this or
; the last frame, >= 1 ms of character set-up steps in this frame, or >= 13 ms of the frame gone. Never delayed:
; forced or full collections (loading screens, the engine's own triggers), menus and loading screens, low memory as
; MemoryRelief sees it. 0 = the game's way. Start-up, then live.
GcPassAfterBusy=1
; Engine behaviour (also without this mod): the cells you leave behind wait in a list until the next garbage-collection
; pass, and the pass first prepares every one of them for collection, all in the same frame (about 0.05-0.1 ms a cell;
; in our play, at a camp after a long ride, 57 cells: about 5 ms of a 14.5 ms pass). With 1, in the last second before
; the pass is due, the engine's own preparation is run for the oldest waiting cells (waiting at least 3 s) in calm frames,
; at most two cells or 0.5 ms a frame, holding the engine's garbage-collection lock as the pass does, and the pass
; prepares only the rest. Nothing is freed earlier: the same pass frees the same
; things. A cell prepared this way and wanted back before the pass is loaded anew instead of being taken back as it is
; (as the engine always does with LevelStreaming.ShouldReuseUnloadedButStillAroundLevels=0); the log counts it. Never in
; a menu, dialogue or loading screen, while files are loading in the background, or in a busy or already slow frame.
; Needs NpcCreationPacing (and uses StreamRegisterGranularity's and StreamOutEndPlaySlice's cell signals). 0 = the
; game's way. Start-up, then live.
GcPrepAhead=1

; With the Frame Rate Limit on, the game waits before each frame until the limit's time is up, also before a frame that
; is about to be long. A sudden drop is that wait plus the long frame: at 60 fps an 8 ms wait before a 25 ms frame shows
; as 33 ms. With a value the wait before a frame known to be long is cut by up to 8 ms: 1 = a garbage-collection pass is
; due in that frame (as GcPassAfterBusy reads it), 2 = a cell is being removed from the world (it goes on in that frame),
; 3 = both. That frame starts and is shown earlier (its input is read earlier, nothing is added), and the game still
; moves on by the time step it would have taken after the full wait, so the frame simulates the same step. Two
; differences remain: the game's clock ends up ahead of the real clock by every cut (up to 8 ms each, for good), and
; when the shortened frame then waits for the render thread and the next frame does not wait, that next frame takes a
; step longer by up to the cut. At most one frame in four, never in menus or loading screens, never without a limit.
; Needs NpcCreationPacing and GcPassAfterBusy. 0 = the game's way. Off by default in this version. Start-up, then live.
CapSleepSkip=0
; Engine behaviour (also without this mod): the engine splits the marking part of a garbage-collection pass across its
; worker threads, and the game thread waits until every part that a worker has started is done. Some of those workers
; run at below-normal priority, so when other programs keep the CPU busy one of them can lose its core in the middle of
; its part, and the whole pass waits for it (with other programs busy, one pass of ours took 16.5 ms where our model of
; passes of that size predicts about 7 ms, the game thread waiting for a worker at its end; the cause is inferred, the gain
; in the game is not measured yet). With 1 a worker below normal priority runs its part at normal priority (the level of
; the game's own threads and the engine's other workers) and goes back to its own priority when the part is done. 2 =
; above normal: the game thread is raised too for its part, and the workers then outrank the render and RHI threads; 2 is
; not recommended. The same work is done and the same objects are collected; only which thread gets a core first changes.
; 0 = the game's way. Start-up, then live.
GcMarkPriority=1

; Game behaviour (also without this mod, and the same in the 2006 game): when a kind of creature comes back after all of
; its kind had unloaded (a horse, a mudcrab, a skeleton on a road you rode before), the game loaded its animation files
; in the foreground: for each file it first paused its background loaders and waited for them, then read the file
; while the game waited (one frame of up to 64 ms in a ride, ours). The game's step that queues a creature for loading
; asks for those files only when the creature's skeleton is not loaded yet, and a skeleton stays loaded longer than its
; animations. With 1 that step always asks for them, as the game already does for summoned creatures: missing files
; are read by the background loader before the creature is finished, behind whatever that loader is doing (in our tests
; a returning creature was finished 50-130 ms after it was queued, as soon as or sooner than without the key), with the
; same animations. 0 = the game's way. Live.
CreatureAnimPreload=1

; Game behaviour (also without this mod): when a person (not a creature) is built, the game asks for every animation
; file of the people's folder, and loads a file that is not loaded in the foreground: it first pauses its background
; loaders and waits for them, then reads the file while the game waits. Nearly all of these files are always loaded.
; The power-attack animations are the exception: the game keeps them loaded while nobody uses them, and its clean-up on
; loading screens leaves them alone, but when the last character that holds one of them lets go of it, that file is
; thrown away, and the next person built loads it again in the foreground (five such moments in about an hour of our
; play; four cost 1-2 ms, one cost 75 ms in a single frame, 72 ms of it waiting for the loaders).
; With 1 a power-attack animation file is not thrown away at that moment: it stays loaded, unused, as the game already
; keeps the ones nobody held. Nothing is loaded earlier or differently and the animations are the same. What stays in
; memory is at most the power-attack files of the kinds of character met since the game started (33 files, 1.4 MB on
; disk, for people; 259 files, 6.0 MB on disk, for every kind in the game), until the game closes.
; 0 = the game's way. Read when the game starts (a restart switches it on), then live.
PowerAttackAnimKeep=1

; When a character puts on a robe, tabard or cape, the game builds its cloth simulation, and the robe's own set-up then
; throws that away and builds it again, often twice, in the same frame. This builds the copies that are thrown away
; without their most expensive part (the cloth's constraint rules) and adds the rules to the one that stays, from the
; same values the game uses, so it ends up exactly as the game builds it. The cloth looks and moves the same.
; 3 = on, 0 = off. Start-up, then live.
ClothRegisterLite=3

; When a far-away character you cannot see is created (NpcCreationPacing), the first build of its robe's or cape's
; cloth simulation waits a few frames instead of running in the middle of that character's creation; the robe's
; repeated requests in that time become one build, made from the robe as it is then. It is built at once when the
; character comes near or into view, when the character's own logic asks whether its cloth is simulating, on a
; loading screen or in a menu, and after at most 60 frames. Timing only (a few frames, off-screen). Needs
; NpcCreationPacing. Installed when the game starts, then live.
ClothBuildDefer=1

; Each animation rig of a new character (body, head, hair) works out a checksum of its animation program four times,
; and it comes out the same for every character of a kind. This remembers the result for exactly the same program
; (everything the checksum reads is compared) and gives it back. Start-up, then live.
RigVmHashMemo=1

; A new character's face rig matches the names in its face data (joints, controls, expressions) to its skeleton,
; building every name as text first, while the main thread waits. This keeps the names the game made for the same face
; data and only looks them up on the new skeleton, the way the game does. Start-up, then live.
RigLogicMapCache=1

; A new character's or creature's Control Rig (the animation rig that, among other things, places the feet) builds its
; bone list from the skeleton one bone at a time: 0.75-1.5 ms each. The first time a kind of rig meets a skeleton, the
; game builds it and the fix keeps a copy; the next rig of that kind with exactly the same skeleton (bone names, parents
; and pose are compared) gets that copy instead, in about 0.2 ms. In our tests the copy matched the game's own build in
; every rig compared. A copy holds its bones in one block of memory: should the game ever remove the first bone of such
; a rig later (never seen), that block is kept instead of freed (about 0.3 MB at most; after 8 such blocks the copies
; switch off until the game restarts). Start-up, then live.
RigImportTemplate=1

; A new character's physics bodies and joints (about 37 for a person) are added to the physics world one by one, and
; each one takes the physics world's lock on its own, waiting each time for other threads that are reading it. This
; takes the lock once for all of them. The same bodies and joints are made in the same order; other threads see the
; character's physics before or after it is made, as they could in the game. Start-up, then live.
NpcBodiesOneLock=1

; Every ~4,100 units of travel the old engine unloads the cells behind you, and the game waits for it: the short hitch
; when you cross open country. Much of that is the animation data of the characters left behind, taken apart piece by
; piece on one thread. This hands those pieces to four helper threads (with the game's own code); every piece of a
; character is gone before the game goes on, as before. Only pieces the fix has recognised are handed over; anything
; else is taken apart as the game does it. Start-up, then live.
AnimTeardownParallel=1

; When the navigation data changes around you (cells streaming in on a road), every character walking somewhere has its
; route searched again, one after another on the game thread: near Skingrad that was 29-34 ms in one frame. This runs
; those searches at the start of that frame on four helper threads, with the game's own search code, and hands each
; result to the game only when every input of the game's own search is byte for byte the same, so the routes are the
; same. Anything that differs, or a navigation change in between, and the game searches as before. Off on PCs with
; fewer than 8 usable logical processors (ParallelMinProcessors). Start-up, then live.
RepathParallel=1

; When a cell's navigation data changes (loaded, unloaded or rebuilt), the characters whose routes crossed it are searched
; again at the start of the next frame; one long search can take a large part of that frame by itself, which
; RepathParallel cannot split. With 1 those searches start on RepathParallel's helper threads at the moment of the
; change, so usually most of the work is done before the frame that needs it. The game's own search code is used, and a
; result is handed over only when every input of the game's own search is byte for byte the same and the navigation data
; has not changed since; anything else, and the game searches as before (a search that can no longer be handed over is
; stopped, not waited for). Before the navigation data's memory changes, a search on it is stopped and waited for.
; Needs RepathParallel. Off by default in this version. Start-up, then live.
RepathEarly=0

; NOT identical to the game (equivalent): a character's route search that would hold up a frame by itself finishes in
; the background. When the navigation data changes, the characters whose routes crossed it have them searched again in
; the next frame, and one long search (a far character whose goal is across a large area) can take 10-15 ms of that frame
; alone. With 1 every such search starts on RepathParallel's helper threads; the frame waits half a millisecond for them
; (the short ones are done by then and used at once, as RepathParallel's). A search still running after that is left to
; finish in the background, and the character keeps following its old route meanwhile, as it already does in the game
; while a route waits for its search. The result is given to the game in the first frame after it is done (usually the
; next one, at most 6 frames later; the frame then waits for it), from where the character stood when the search began:
; it is used only if the character and its goal are still within half a metre of those points and nothing else changed,
; else the game searches again as before. If the navigation data changes meanwhile the background search is dropped and
; the game searches as before. A search that reaches a navigation link the game must decide on (for example a door)
; stops in the background (the link is a question to the game); when every search has ended within the half
; millisecond and one stopped at such a link, the frame runs as with 0 (RepathParallel searches them side by side). Needs RepathParallel. Start-up, then live.
RepathDefer=1

; NOT identical to the game: calm characters at least 100 m away (walking, wandering, travelling, eating, sleeping,
; waiting) move at FarPawnMoveHz instead of every frame, with the skipped frames' time added to the next step: what every
; character gets on a PC that runs the game at that frame rate. Far away they move in small steps (30 a second); their
; routes, speeds and where they arrive stay the same. Fighting, fleeing, following, talking, swimming, mounted or running
; characters, characters playing an animation that moves them, and everyone near you move every frame as before. Saves
; game-thread time where many characters are about (towns, roads). 1 = calm far characters at walking pace, 2 = at any
; speed, 0 = off (every frame, as the game). Needs NpcCreationPacing. Start-up, then live.
FarPawnMoveHalfRate=1
; The rate for those far characters and horses, 1-59 steps a second (60 or more = every frame). Live.
FarPawnMoveHz=30
; The same for horses at least 100 m away: 1 = calm horses without a rider, 2 = also horses carrying a calm character,
; 0 = off. Live.
FarHorseMove=2

; In big fights the old engine's own thread starts each frame with a short sleep (1-2 ms) while it waits for its path
; finder, and the game waits for that thread. Bit 1: the sleep ends as soon as the path finder is done (or at once when
; it has nothing to do), never later than before; the old engine sees the same result. Bit 2: a timer the old engine
; reads for its own profiling, which nothing uses, is no longer read (about 0.9 ms per frame in a big fight).
; 3 = both, 1 or 2 = one of them, 0 = off. Start-up, then live.
OtFrameTrim=3

; In fights each spoken line makes the old engine look for a loose voice file that is never there (the voices are in
; the game's archives), twice per line, on the thread the game waits for. A voice file found missing once is answered
; from memory afterwards, as missing. Anything else, and anything found, is checked as before. 0 = off. Start-up, then
; live.
LooseMissCache=1

; The cells that fall out of the old engine's "recently visited" cell buffer at such a crossing were all unloaded inside
; the crossing frame (5-20 ms at Kvatch). This gives the buffer a few spare slots (as a bigger uExterior Cell Buffer in
; Oblivion.ini would) and unloads those cells one per frame over the next few frames, oldest first, with the game's own
; unload. After about a tenth of a second the buffer is as the game would have it. Doors, fast travel and loading a save
; unload them at once, as before. The game writes Oblivion.ini when it quits; your own value is written back, so the
; spare slots are never saved. Start-up, then live.
CellBufferPacedEvict=1

; How long after a crossing those cells start to be unloaded, in milliseconds. In the first second after a crossing the
; game is busy bringing in the new row's people and things; waiting this long keeps the unloading out of those frames.
; The same cells are unloaded in the same order on the same thread, about one and a half seconds later: until then the
; cells about 150 m behind you stay loaded, as with a bigger uExterior Cell Buffer. 0 = right after the crossing (as in
; 1.2). Needs CellBufferPacedEvict. Live.
CellBufferEvictDelayMs=1500

; A cell you left with many people in it took one long step of the old engine to unload: about 20 ms for one cell of
; the Imperial City Waterfront with ten characters, which made the game thread's frame there 24-33 ms. With a number
; here, the bodies of that many of its characters are unloaded per frame (with the game's own call for each, in the
; game's order, before the rest of the cell, on the same thread) over the few frames before the cell itself is
; unloaded: five or six steps of 3-5 ms instead of one of 21 ms. The same cells and characters are unloaded, a few
; frames apart, far behind you. While any arrow is in the world,
; and for a character that a spell effect is on, the game's own unload is used. A small gain: in our tests it removed no
; drop you would see by itself. 2 is what we tested and recommend; 0 = the game's unload in one step. On by default.
; Needs CellBufferPacedEvict. Live.
CellEvictSplit=2

; Game behaviour (also without this mod): the original 2006 game loaded the next row of cells ahead while you rode
; towards it, so a crossing only had to switch them on. The remaster still asks for that row but never loads it, so the
; whole row is read from the game files inside the crossing frame and the game waits for it (a few ms at every crossing,
; more in towns and forests). With 1 the cells the game asks for are loaded ahead with the game's own loader, one per
; quiet frame, and kept in the cell buffer like cells you have just left; the crossing then finds them loaded. The same
; cells with the same contents; nothing appears earlier (a cell is still switched on at the crossing). Not in interiors,
; menus or loading screens. Needs CellBufferPacedEvict and NpcCreationPacing. Start-up, then live.
RowPreload=1

; Game behaviour (also without this mod): the game makes a character in one piece on the game thread, 6-7 ms for a
; person, at the moment its cell is switched on. A crowd arrives as a train of those, one per frame, in frames that are
; already busy: the long frames when people appear at a crossing, a bridge or a town gate. With 1 the first half of
; that work (Unreal's SpawnActor: the actor, its parts, the body's first animation set-up, its physics) is done a few
; seconds earlier, one character per frame and only in frames that had time to spare in the frame-rate cap, 500 m below
; the character's place; the game's own create then takes the actor that is already there and does the rest as before
; (it puts it at its place, starts it, dresses it, fades it in). In our tests a create that found its actor took about
; half the time (2.9-3.4 ms instead of 6.1-6.9 ms); at a crowd, frames holding a create were 20 ms or longer about a
; quarter of the time instead of half, while the longest frames (28 ms and more) did not change. A frame that builds
; one ahead reached 18.5-21.75 ms at most. Who will come is read from the cells RowPreload
; loads ahead; for creatures and people the game places from its levelled lists, up to 3 spare actors are kept for a
; kind it has created in the last 90 seconds. The same characters at the same places with the same looks; what differs
; is when that half of the work ran. An actor is taken only when the game asks for exactly what was built (the same
; class, the same settings, the same scale), else it is thrown away and the game makes its own. Nothing built ahead is
; kept across a menu, a loading screen, a door, fast travel or a save; at most 12 are kept, 20 seconds each. Nothing is
; built while the game's garbage collection is clearing memory, and each build looks its character's class up again.
; Needs a frame-rate cap (the game's own): without one no frame has time to spare and nothing is built ahead. Needs
; NpcCreationPacing and CreatePreload; RowPreload for the characters of the cells ahead. 0 = every create as the game
; does it. Start-up, then live.
CreateAhead=1

; With CreateAhead: an actor is only built ahead after a frame that waited at least this many milliseconds in the
; frame-rate cap (1-14). A build can make a quiet frame up to about 20 ms (18.5-21.75 ms at most in our tests at 4);
; lower builds more often and in busier frames, higher builds only in very quiet ones. 4 is what we tested. Live.
CreateAheadSlackMs=4

; With CreateAhead: how many actors may wait at most. 0 = as before: 12 at most, spares for the game's levelled
; creatures and people only while fewer than 8 wait, and a spare waits until its kind has not been made for 90 seconds.
; 12-32: up to this many wait, spares while fewer than this minus 4 wait, and a spare of a kind not made for 20 seconds
; (and made longer ago than the kind that wants the room) is thrown away (in a quiet frame, one per frame) to make room
; for a spare of a kind the game made in the last 20 seconds, so the waiting actors follow the creatures of the road you
; are on. More waiting actors use more memory (each is a character built up to its first half), and more of them are
; built and thrown away unused. Live.
CreateAheadPool=24

; With CreateAhead: the creatures and people the game placed from its levelled lists at an earlier visit of a cell stay
; in that cell (with the kind the game chose then) while you are away; when you come back, the game makes their
; characters again at the crossing, one per frame. With 1 those already-chosen characters in the cells loaded ahead are
; built ahead like the game's placed characters (their own place, kind and scale), instead of only finding a spare of
; their kind. The game's choice is never made or changed here: only characters it has already chosen are read. Costs
; more builds in quiet frames when you turn away before the crossing (each is thrown away after 20 seconds). 0 = run-time
; characters get spares only. Live.
CreateAheadLevelled=1

; Game behaviour (also without this mod): when a cell is switched on, the game makes the things placed in it (books, food,
; quills, alchemy sets, chests and other loose objects) on the game thread, and when an object's files are not loaded yet
; the game stops and reads them from disk inside that frame (1.4-3.7 ms each; 12 ms of one 27 ms frame on the road to
; Aleswell). With 1, when RowPreload has loaded the next row of cells a few seconds before you reach it, the files of the
; objects placed there (and of the characters; not of rocks, walls and houses, which the cell loads in the background
; itself) are asked for in the background with the game's own loader, below the game's own background loads; an object
; that needs its files first raises them to its own priority. The objects are then made when and as the game makes them
; and find their files loaded. Nothing is made earlier or later and nothing is kept: files of a cell you turn away from are
; freed by the game's next memory clean-up, as anything unused. At most 16 requests per frame. Needs NpcCreationPacing,
; RowPreload and CreatePreload. 0 = each object loads its own files, as the game does. Start-up, then live.
CellObjectPreload=1

; ===================================================================================================================
; Doors, loading screens and start-up
; ===================================================================================================================

; After a door, city gate or fast travel the picture came back with one long frame: while the world is frozen behind
; the loading screen, the physics engine is not told about the thousands of objects the new area added, so the first
; frame afterwards takes them all in at once. This hands them to the physics engine while the loading screen is still
; up, the way the engine's own "flush" does it. Nothing is simulated meanwhile (nothing moves, collides or wakes up), and
; the world, the fade-in and your controls start exactly when they did before. Start-up, then live.
PrepareCollisionBehindLoadingScreen=1

; While a door, city gate or fast-travel loading screen is up, the game empties its texture memory, and once the new
; area has loaded it holds the last loading-screen image until that area's textures are back in (a few tenths of a
; second, longer after stepping outside). This lets the textures come back while the loading screen is still idling, as
; soon as the area's loading is done, so the world appears sooner. The game's own texture wait still runs before the
; picture comes back; in our test the loading screen even ended a little sooner. Needs NpcCreationPacing. Start-up,
; then live. Pull request #34 by Mishu117.
StreamBehindLoadingScreen=1

; At that same moment the new area is still frozen and hidden behind the loading screen, so the first picture of it is
; drawn only when the loading screen fades out (a long first frame). This draws the frozen area for this many frames
; behind the loading screen (still covered by it), then hides it again until the game's own fade-in. Nothing moves or
; runs meanwhile: only drawing. Equivalent rather than identical: the first visible frame builds on those few frames'
; image history instead of starting fresh. Rarely the loading screen stays up one more half second; on average its
; picture went away sooner in our tests. 0 = off, 2-10 frames. Needs StreamBehindLoadingScreen,
; PrepareCollisionBehindLoadingScreen and NpcCreationPacing. Live.
DrawBehindLoadingScreen=3

; At start-up, while the screen is still black, the game stops before the first logo (about 3 s in our 4K start-ups).
; About 1.5 s of that is its old engine, its data already loaded, filling its own loading bar from 0 to 100, one percent
; per tick of the Windows clock (15.6 ms), stopping its loading threads and redrawing a loading menu nobody sees at each
; percent. With 1 that bar is set to its end at once for the first loading menu after the game starts (the black screen),
; the state those 100 steps end in anyway; nothing that was loaded changes, and no later loading screen is touched.
; Every loading screen in play ends with the same 1.5 s (the picture stands still meanwhile). 2 (the default since 1.6.0)
; also ends those at once: each loading screen 1.5 s shorter. That changes what you see (the end of every loading screen
; comes sooner) and shortens the idle time that DrawBehindLoadingScreen and StreamBehindLoadingScreen use: set 1 to keep
; the game's loading screens and shorten only the black screen at start-up. 0 = the game's way. Start-up, then live
; (from the next loading screen).
StartupBarFinish=2

; Before the first logo the game's old engine reads its plugin files (Oblivion.esm, the DLC and Altar plugins, about
; 340 MB) piece by piece while the screen stays black. In three of our slow start-ups those reads took about 2 s longer;
; we think the files were no longer in Windows' file cache then, but we could not force that case, so this is a
; hypothesis, not a measured gain. With 1 a low-priority helper thread reads the files listed in Data\Plugins.txt once,
; start to end, right after the game starts (about 5 s in, 7-9 s before the old engine needs them), so they come from
; the cache. It only reads (one 1 MB buffer, freed when done) and then ends; missing files are skipped. Tested on an NVMe
; disk only: on a hard disk, if start-ups get slower, set 0.
; 0 = off. Start-up only.
PluginPrefetch=1

; While loading its plugins at start-up the game's old engine sorts its list of dialogue topics by name with a slow
; method (a bubble sort: millions of name comparisons, about 0.4 s with the black screen up in our start-ups; the
; same sort is also used when you learn a new topic, with no change there). With 1 the list is sorted with a merge sort using the game's own name
; comparison, which gives exactly the same order. 0 = the game's sort. Switching it on needs a restart (the hook is
; written when the game starts).
TopicSort=1

; After every start the game builds about 18,000 graphics pipelines (shader combinations) in the background at a slow
; pace, for two to three minutes: through the main menu and your first minutes of play, holding every loading screen up
; to 5 seconds longer. This lets it run faster while you are not playing (main menu, loading screens) and gives the
; game's slow pace back the moment you play. The same pipelines are built. Start-up, then live.
; It runs only together with TaskWaitDeadlockGuard below (installed and 1): the faster pace hands the engine more work
; at once, and as a precaution against a freeze reported on the OBSE64 route (cause not confirmed) it is kept to the
; case where that guard protects the task threads. Where the guard is not installed (a late load as an OBSE64 plugin,
; TaskWaitDeadlockGuard=0 at start-up) the game keeps its own pace and the log says so. To get the game's own pace back, set this key to 0 (live) or TaskWaitDeadlockGuard=0 before starting the
; game. TaskWaitDeadlockGuard=0 while the game runs is refused as long as PsoCompileThreadPool is on (the default), and
; the faster pace then stays.
PsoPrecompileFast=1

; How much render-thread time per frame the faster pace above may use, in milliseconds. 4 keeps the main menu smooth
; while it runs; 16 = the engine's own fast pace (as in 1.1.0: main-menu frames of 30 ms and more). Live (within
; a second).
PsoPrecompileFastBudgetMs=4

; After a graphics driver update or on a new install the driver has to compile every pipeline for real, which takes
; minutes. Pushing that faster only queues work in front of what the game needs right now (long loading screens,
; freezes), so once this many pipelines wait (or the driver is seen compiling for 2 s, or the fast pace has run for
; 60 s), the game's own pace is kept until the build ends. 0 = none of these checks (the fast pace until the build
; ends, as in 1.1.0). Live.
PsoPrecompileColdQueue=1000

; Whether the fast pace above also applies in menus you open while playing (inventory, map, dialogue, pause). After a
; graphics driver update the build takes several minutes, and the fast pace made those menus lag, so by default they
; keep the game's slow pace (so does the main menu after you quit a game). 1 = fast there too (as in 1.1.0). Live.
PsoPrecompileFastInGameMenus=0

; ===================================================================================================================
; Menus
; ===================================================================================================================

; Opening the menu on the Graphics page froze the game for about a fifth of a second (more with several monitors): the
; page asked Windows for every display mode of every monitor, eight times over. This keeps each monitor's list and
; checks at every rebuild that Windows still reports the same modes (otherwise it reads them again). Start-up, then live.
DisplayModeCache=1

; Every time a menu opens, the game takes a picture of the screen and runs it through a slow filter one pixel at a
; time (about 0.15 s at 4K). This computes the same picture, byte for byte, about 40 times faster. Start-up, then live.
MenuScreenshotFilter=1

; The same picture is first read back from the graphics card and turned into 8-bit colour one pixel at a time (about
; 45 ms at 4K). This computes the same colours, byte for byte, about ten times faster. 2 = on, and checks itself against
; the game's own code on every picture (slower; for testing). Start-up, then live.
ScreenshotReadbackConvert=1

; What is left of that picture's cost is copying it: six copies of 33 MB at 4K, each on one thread. This spreads them
; (and the two fixes above) over a few helper threads and skips one fill with zeros that is overwritten anyway. The same
; picture, byte for byte. Start-up, then live.
ScreenshotParallel=1

; Opening the map, the game builds all its map markers (a few hundred small widgets) three to five times in the same
; frame, and each time removes the ones it built the time before, before anything has drawn or looked at them. This
; skips building the lists that are removed unseen (1) and, when the game rebuilds the markers from an equal list, keeps
; the ones already there with the new list's data (4); 5 = both. The markers you see are made from the same final list,
; and every marker that is shown, hovered or looked up is built first. Each time you open the map it starts fresh, as
; before. 0 = off. Needs NpcCreationPacing. Start-up, then live.
; What it touches in the game (for other map mods): a small step in front of the map functions that can touch the
; markers (46 of 83: the map's, its marker filter's and the markers'; the local map's texture loads and unloads, the
; getters and the coordinate helpers are left as the game has them), the first bytes of nine marker functions, two calls
; and the map's event function. UE4SS hooks on these functions keep working. If another map mod does not work beside
; it, set 0 and restart the game: then none of it is installed.
MapPopupSpread=5

; The picture behind an open menu (inventory, magic, map, pause) is a filtered copy of the screen. Even with the fixes
; above, the game stopped until that copy had come back from the graphics card (about 45 ms at 4K). This makes the same
; picture on the graphics card itself, in the same frame, with the game's own colour conversion and filter: the same
; bytes, and the game no longer waits. It keeps two screen-sized buffers in video memory once a menu was opened (about
; 63 MB at 4K, 16 MB at 1080p). Needs SaveThumbnailAsync, MenuScreenshotFilter and MenuOpenFlashFix; any picture it
; cannot make is left to the game. Not used on Intel GPUs or with a third-party swap-chain or frame-generation layer
; (OptiScaler and similar, also ReShade or Special K as dxgi.dll; a GPU crash at menu opens was reported with OptiScaler,
; issue #54): there the game makes the picture, as with 0, and the log says so once. 0 = off. Start-up, then live.
GpuMenuShot=1

; ===================================================================================================================
; Saving (quicksaves, autosaves, saves from the menu)
; ===================================================================================================================

; Every save also rewrites the list of saves, which holds a small picture of each save, twice. The game wrote those
; pictures one byte at a time (about 30 ms of the game's main thread per save). This writes each picture in one piece:
; the same bytes in the same file. Installed when the game starts, then live.
SaveBytesBulk=1

; A quicksave or autosave takes a screenshot for the save's picture, and the game stopped until the graphics card had
; finished everything and the picture was copied back (40-50 ms at 4K). This copies the same picture in the background
; and hands it to the save when it is ready, a few frames later; the save is written after it, as before. The same
; picture, byte for byte. Saves from the pause menu and while resting or waiting are left to the game. Installed when the
; game starts, then live.
SaveThumbnailAsync=1

; The game's older save code looks up every object reference of a save in a list, from the start each time; the list
; grows the longer you play. This keeps an index of that list, so each lookup is direct: the same numbers in the save.
; Installed when the game starts, then live.
SaveRefIdIndex=1

; ===================================================================================================================
; Frame generation (FSR 3 frame generation, and AMD's ML frame generation on Radeon RX 9000)
; ===================================================================================================================

; With frame generation on, the game computed each generated frame on the graphics card in a line with its own frames,
; and the card kept waiting: in Cheydinhal at 4K the rendered frame rate fell by 20-25 %. AMD's plugin has a setting that
; runs that work on a second queue of the card, beside the next frame (r.FidelityFX.FI.AllowAsyncWorkloads); the game
; leaves it off. This switches it on: +22-29 % rendered fps there, the same images and frame pacing. An
; r.FidelityFX.FI.AllowAsyncWorkloads line in your own Engine.ini still wins. Start-up only.
FrameGenAsyncCompute=1

; Only with AMD's newer FSR DLL (see "AMD ML frame generation" in the README; the game's own FSR 3.1.0 DLL has no such
; setting, so this then does nothing). AMD's frame generation spaces the frames out by a target it works out from the
; last frames; after a few long frames (arriving in a new area) that target stays too long for seconds. AMD documents
; this and recommends tuning sets: 1 = Tuning Set B (AMD's recommendation for this case), 2 = Set A, 0 = AMD's default.
; With 1, frame generation run by AMD's graphics driver itself (Adrenalin's own FSR, see the README) keeps the driver's
; own pacing, which shows frames more evenly there; 3 = Set B there too (what 1 did up to 1.2.1).
; Only when frames are shown changes, not what is drawn. Live.
FrameGenPacingTuning=1

; Only matters with AMD's newer FSR DLL on a Radeon RX 9000 (see "AMD ML frame generation" in the README): AMD's ML frame
; generation also needs the camera's position and direction, which the game's FSR 3.1.0 code never sends. This sends
; each frame's camera along, the way AMD's own newer Unreal plugin does. With the game's own DLL nothing reads it.
; Start-up, then live.
FrameGenCameraInfo=1

; ===================================================================================================================
; Memory safety
; ===================================================================================================================

; Some fixes above keep memory on purpose (UploadMemoryKeep, LumenKeepArrayCapacity, OsPageCache: up to about 0.5 GB,
; RAM or, for UploadMemoryKeep on our AMD test card, video memory). When Windows has less than 1 GB of RAM left for 3 seconds, or less than 1 GB of commit (RAM plus page file),
; they behave as the game does until there is twice that free again for a minute. Each change is logged. No fix is
; switched off for video memory: going over it moves memory to system RAM, which costs speed but does not crash the
; game (CommandAllocatorTrim gives back what the game no longer needs instead). Live.
MemoryRelief=1

; Graphics that use the PC's own RAM instead of video memory of their own (integrated graphics, APUs and handhelds
; such as the ROG Ally or Legion Go): there every byte the fixes above keep, and every byte the graphics use, comes
; out of the same RAM the game and Windows need. On such a PC UploadMemoryKeep, LumenKeepArrayCapacity,
; GpuSceneKeepCapacity, RtSceneBufferKeep and OsPageCache behave as the game does, the automatic RdgParallelTranslate
; stays off, and CommandAllocatorTrim hands spare memory back after every load. The log says what it found and why.
; 2 = automatic: on Windows PCs with such graphics and less than 20 GB of RAM (16 GB handhelds such as the ROG Ally,
; Legion Go or MSI Claw; not with Proton or CrossOver, so not on the Steam Deck or a Mac, where Linux and macOS
; handle running out of RAM their own way, and not with 20 GB or more, so the 24 GB ROG Xbox Ally X keeps every fix).
; 1 = always (as on such a PC: try it if a 24 GB handheld freezes), 0 = never (as on a graphics card with its own
; memory). Live.
SharedMemoryGpu=2

; Every batch of work sent to the graphics card needs its own block of video memory, and the game keeps every block it
; ever needed at once, for the whole session: after loading an area about 400 of them, around 0.4 GB (the stock game
; too). When the game gets within about 2 GB of the video memory Windows gives it, this hands the spare ones back, a few
; at a time, about 20 seconds after a load. Anything needed again is made anew, as when the game's stock runs out. On a
; card with plenty of memory to spare it does nothing. AllocatorTrimCopyFloor below sets how many it never gives back.
; Live.
CommandAllocatorTrim=1

; How many of the copy queue's blocks CommandAllocatorTrim never gives back, counting those in use (about 1 MB of video
; memory each on our AMD test card). It only stops give-backs and never makes blocks: after the game starts, or after
; 10 seconds over the video memory budget (when it gives back more anyway), there can be fewer until the game needs more.
; Earlier versions could leave as few as 12 after a load, and making many again in one go on a ride may hold up the
; picture. To tune it, watch the log's "copy N real (... +M made, -K trimmed ...)" lines: many made again while riding
; after a trim -> raise it; 64 is what we suggest (the default since 1.6.0). 0 = as before. 0-512. Live.
AllocatorTrimCopyFloor=64

; The same blocks from the other side, on AMD graphics cards with 16 GB of video memory or more: when a busy moment needs more of them than exist,
; tens of new ones get their memory in one go and that frame stutters (the stock game too). This makes them once, behind
; the first loading screen, in about 2 seconds in the background, so that moment passes without it. Nothing is drawn or
; sent to the card and no game logic runs. It sees the loading screen through NpcCreationPacing; with that off it runs at once,
; as up to 1.5.0, when it ran while the start-up logos played and made them stutter.
; What it costs: up to 0.8 GB of video memory from the start of the session; without this the
; game grows towards about 0.5 GB during play. If the game gets within 0.5 GB of the video memory Windows gives it, it hands
; back once what the session has not used so far, but a card that fills up quickly can get there first, a busy moment
; right after it stutters more than in the stock game, and going over that memory is what came before the rare graphics
; driver hangs on our test PC.
; Set it to 0 if another program fills your card's memory while you play, or you get graphics driver hangs. It stays off
; by itself, and the log says why, on other cards, handhelds and Linux, without RdgParallelTranslate, under 6 GB of free
; RAM or 4 GB of free commit (RAM plus page file), and once the first area is up. Read at start-up.
CmdMemPregrow=1

; ###################################################################################################################
; PART 2 OF 3: GAME BUG FIXES (the game does what it was meant to; 0 = closer to the stock game)
; ###################################################################################################################

; Each switch in this part fixes a bug of the game itself (it happens without OblivionPerfFix too). Unlike the
; performance improvements above, the result is not the stock game's: the bug is gone. They are on, except three, which
; say why they are off. To stay closer to the stock game, set them to 0, together or one by one; the crash
; and freeze guards are best left on (with 0 the game's crash or freeze can come back).

; ===================================================================================================================
; Crashes and freezes in the game, its engine and AMD's library (best left on)
; ===================================================================================================================

; The game keeps a list of names (places, sounds, quests) that some of its systems look up, for example the sound of an
; object hitting the ground. After every start or load, thousands of its entries point at memory the game has already
; freed, and a lookup crashes if Windows has taken that memory back by then (seen after several games in one session).
; Such an entry is now skipped, which is what already happens whenever that memory still exists. Start-up, then live.
NameLookupCrashGuard=1

; A trap (falling rocks, a swinging log, spikes) keeps a list of the characters it is touching. When a character in that
; list is removed from the game (seen at the Kvatch Oblivion gate), the game can forget to take it off the list, and the
; next physics step crashes. Such a character is now taken off the list, as the game does when a character steps away
; from a trap. Traps still hit and push everyone who is there. Start-up, then live.
TrapCrashGuard=1

; In big fights the game's old engine can pop up a leftover debug box, "42 Havok picks (6 path, 36 LOS, 0 ViewCaster) used
; this frame.", on its own thread, and the whole game stands still (often hidden behind the game window) until someone
; closes it. The box only reports that the engine skipped some sight and path checks that frame, which it does with or
; without the box (its limit, iMaxPicks in Oblivion.ini, is not changed). The box is now written to this log instead.
; Start-up, then live.
HavokPickWarningGuard=1

; A rare game crash ("UObjectArray.cpp:234 Attempting to add ... but another object exists at that index"): when the
; game makes an object again in the place of an old one with the same name (its AI does this many times a minute), the
; old object's entry in the engine's object list could stay behind, and the game then stopped with that error. Such an
; entry is now cleared, as the engine does in every other case, and the log says so. Nothing changes otherwise.
; Start-up, then live.
ObjectReplaceCrashGuard=1

; A rare crash when arriving somewhere new (in the game's code at 0x4590F5C): the game releases each buffer of its
; old engine's "pairing" sessions twice. That is harmless on its own, but when another session takes the buffer in
; between, the second release frees it under that session and two sessions end up sharing one buffer. The double
; release is the game's; our NpcCreationPacing made the timing where it does harm possible (in our tests it never
; collided with pacing off, and we have not seen it without the mod). 1 = each buffer is released once, by the game's
; own last release; the skipped early ones are counted in this log. Nothing else changes. Start-up only.
PairReleaseOnce=1

; A rare crash in the game's engine (Unreal Engine bug UE-217692, fixed by Epic in a later version): a "view" of a
; buffer created at the very moment the engine moves that buffer in video memory keeps pointing at the old place, and
; the game crashes when it uses it. Creating the view and moving the buffer now wait for each other, and such a view is
; corrected on the spot. With this on, RdgParallelTranslate no longer has to pause that tidying, which saves about
; 0.2 GB of video memory. Start-up, then live.
ViewRenameGuard=1

; A crash in AMD's FidelityFX library (frame generation): it keeps 8 command lists per GPU queue and crashed instead of
; waiting when the graphics card was still busy with all 8 (a long stall, for example at 4K with video memory full).
; Now the game waits for the card to finish one (a few milliseconds, 3 seconds at most). Nothing changes while the card
; keeps up. Works with the game's FSR 3.1.0 DLL and with AMD's 3.1.4 DLL. Start-up, then live.
FrameGenCrashGuard=1

; A game bug: the game can freeze and, after 2 minutes, end itself ("GameThread timed out waiting for RenderThread").
; The engine's task threads all wait for each other's wake-up calls, which nobody is left to send. It happens most
; after a graphics driver update or on a new install (nothing in the driver's shader cache), and on CPUs with 4 cores
; also with everything cached. With 1 a waiting task thread is also woken by the helper thread that covers for it.
; Nothing else changes. 0 = the game's way. Start-up, then live (but it stays on while PsoCompileThreadPool below is
; in use, which needs it). Both routes; only a late load as an OBSE64 plugin leaves it off (the log says so).
; PsoPrecompileFast's faster pace runs only while this is installed and 1.
TaskWaitDeadlockGuard=1

; A game bug: after a graphics driver update or on a new install, the game prepares its graphics pipelines on the same
; task threads that loading and the rest of the game need, and with nothing cached each one takes the driver a long
; time; on 6-core CPUs the first teleport froze for 30 s and more, on 4-core CPUs loading barely moved. With a number here they
; are prepared on that many threads of the engine's own pipeline thread pool instead (-1 = the number of logical
; processors minus 2, at least 1: about as many as the game has task threads), at lower priority. The same pipelines,
; the same picture. 0 = the game's way. START-UP ONLY: the engine treats the size as fixed, so a change while the game
; runs is ignored (the log says so) and takes a restart. It is used only together with TaskWaitDeadlockGuard=1 (the
; pool alone can run into the deadlock above); without it the log says it was not applied. If your own Engine.ini
; sets r.pso.PrecompileThreadPoolSize or ...PercentOfHardwareThreads, yours is kept and this is not applied.
PsoCompileThreadPool=-1

; ===================================================================================================================
; The game does what it was meant to
; ===================================================================================================================

; A game bug: after an alt-tab, FSR and frame generation often stayed off (native resolution, lower frame rate) until
; you changed the upscaler in the settings. The game switches FSR off while its window is in the background and on
; again when you come back, but only if it thinks no menu is open, and once you have used the inventory, map or wait
; menu it keeps thinking one is. This switches FSR back on, the way the game does, as soon as no menu is open. If you
; chose another upscaler meanwhile, that choice stays. Start-up, then live.
RestoreFsrAfterAltTab=1

; A game bug (GitHub issue #5): when you open the pause menu, inventory or map after a while without one, one frame
; shows a bright sky and the edge of the world behind the menu. The menu's background is a small scene far outside the
; world; on the frame the menu opens, the engine's occlusion culling judges that scene from your old camera, and on the
; next frame it hides the menu's backdrop. This switches occlusion culling off for that one frame and back on right
; after: the frame looks the same, it is one longer frame at menu open, and the next frame shows the menu as it should.
; Start-up, then live.
MenuOpenFlashFix=1

; Game bug: with frame generation on, the Frame Rate Limit you saved in the Graphics settings is not in effect after the
; game starts (the frame rate is uncapped) until you open the Graphics page, which applies it again. Switching frame
; generation on clears the limit, and the game replays that switch when it applies your saved settings at start-up. This
; applies your saved limit once right after that start-up switch, exactly as opening the page does. Later switches of
; frame generation are left to the game. Since 1.2.2 only with FSR frame generation on AMD and Intel graphics cards: with
; DLSS frame generation or on NVIDIA cards (where the game can turn NVIDIA Reflex on, and the limit then goes to Reflex's
; own limiter, which we could not test) it is left to the game, as without the mod. Start-up only (both routes, also
; OBSE64).
FrameRateLimitAtStart=1

; A game bug: a robe, tabard or cape could stretch into a long strip back to where its wearer had been. It happens when a
; character whose cloth is frozen (not simulating, for example out of sight) is moved and its cloth then switches level
; of detail: the game moved the cloth only part of the way. This moves it all the way, with the engine's own "teleport"
; for that cloth. Cloth that is simulating is not affected. Start-up, then live.
FrozenClothStretchFix=1

; The game waits for its shader compile behind a "Shaders preloading" screen only on its very first launch. After a
; new graphics driver it compiles in the background instead, during play, and stutters for minutes. 1 = after the
; graphics card or its driver changed (recorded in OblivionPerfFix-gpu.txt next to this file; the first launch with
; the fix only records it), the game shows that screen again at start-up, built at the engine's fast pace (about 3
; minutes with an empty driver cache), as it does on a first launch. Your settings are kept. 0 = the game's behaviour:
; no screen, the shaders are built while you play. Start-up only. Pull request #33 by
; Mishu117.
ShaderScreenAfterDriverChange=1

; With "Show VRAM" on in the Graphics page, the counter always reads "VRAM: 0/0": the game reads two numbers its
; engine never fills in. 1 = when both come back 0, the counter shows the game's video memory use and the budget
; Windows gives it (in MB, refreshed once a second), the same two numbers the engine was meant to supply. Nothing else
; changes. Start-up, then live. Pull request #33 by Mishu117.
VramCounterFix=1

; Monitors wider than 4095 pixels can name a smaller resolution first in the description they send (an Alienware
; AW3926QW says 3440x1440 for its 5120x2160), and the game takes that as the native resolution: borderless shows it,
; and fullscreen lists only resolutions of exactly its shape. 1 = the native resolution comes from Windows instead
; (the monitor's preferred mode). Takes a restart. Pull request #35 by Mishu117.
MonitorNativeFromWindows=1

; Bow sneak attacks often say "Sneak attack for 1X damage" and do 1x (a game bug). Both of the game's engines check
; where your arrow lands: the new one uses your bow's sneak multiplier (2x or 3x), the old one always uses 1x, and
; whichever sees the hit first wins; when both see it, the target is hit twice. 1 = each of your arrows hits once,
; with your sneak multiplier. This changes damage, back to what the game intends. 0 = the game's 1x and double hits.
; Installed when the game starts if on, then live. Pull request #35 by Mishu117.
BowSneakAttackFix=1

; After a magic effect with a look on the character ends (fire, frost, shock, a drain, an enchanted weapon's hit), its
; colour can stay on your weapon, bow, staff or quiver and arrows until you equip them again (a game bug, issue #48):
; the game puts the look on everything you carry but takes it off only your body, armour and shield. A rider who gets
; off the horse before the horse's effect ends keeps the horse's look the same way. 1 = once the effect has ended, a look
; left behind is taken off; if a look under it is still on and still belongs to that item (the item's own effect, or that
; of the character or horse it is attached to now), that look stays instead. Nothing changes while an effect is on.
; 0 = the game's behaviour. Installed when the game starts if on, then live.
StuckEffectLookFix=1

; A game bug (GitHub issue #52): an NPC lighting a torch is heard at full volume in both ears from anywhere in the loaded
; world, often from guards 100 m or more ahead whom you cannot see yet. Deer, daedra-spider and ogre footsteps and eleven
; dungeon traps fade with distance but always sound centred. The game's own sound data switches 3D sound off for these
; few sounds (for the torch also the fade with distance, although a 20 m fade is set up for it). 1 = while the game loads
; its sound data, these 15 sound entries get 3D sound like the sounds around them: the torch is heard from where it is
; and fades out over 20 m, the footsteps and traps come from their side and keep their own fade. Each entry is changed
; only if its data is exactly what this version of the game ships; nothing on disk changes, and no other sound changes.
; 0 = the game's behaviour. Takes a restart.
WorldSoundPositionFix=1

; A game bug (GitHub issue #52): when another character's arrow hits someone, the game plays the hit sound at the
; shooter's bow, once or twice, often besides once where the arrow hits. A hunter near you can make a hit on a deer 100 m
; away sound right beside you at full volume. 1 = such a hit is heard once, where the arrow hits, like a sword's hit, with
; the sound the game gives that hit; if it cannot be played there, the bow's plays as before, so no hit goes silent. Your
; own arrows are unchanged. 0 = the game's behaviour. Installed when the game starts if on, then live.
ArrowHitSoundFix=1

; With Effects Quality Ultra and a render more than 3840 pixels across (an ultrawide such as 5120x2160 or 5120x1440 at
; DLSS DLAA or FSR Native AA), sunlit skin and cloth edges show glowing magenta specks (a game bug). 1 = while the
; render is that wide, skin scattering uses the engine's separable method instead of Burley (r.SSS.Burley.Quality 0),
; which shades skin differently; at 3840 or less (4K and below, or DLSS Quality on the ultrawide) the game's Burley is
; back within a second. 0 = the game's skin everywhere. Live. Pull request #35 by Mishu117.
SeparableSkinAbove4K=1

; Each save made while a menu is open (the autosave of a fast travel, a save from the System menu) leaves its
; thumbnail handler attached to the menus' screenshot until you quit the game (a game bug): the game meant to remove
; it, but removes it from the wrong list. Every later menu then copies its background picture once more per such save
; (our estimate from a timed 33 MB copy: about 1.5-3.5 ms each at 4K, so after ten fast travels a menu would open
; 15-35 ms slower). 1 = the handler is removed
; once its save has its picture, as the game intended. Saves, thumbnails and gameplay stay the same. Installed when
; the game starts if on, then live.
SaveThumbLeftoverFix=1

; ===================================================================================================================
; Off by default (switch one on if you want it)
; ===================================================================================================================

; Off by default (0): with all four autosave options off it also takes away the level-up and quest autosaves, a
; save you may want to go back to. Switch it on if you want no automatic saves at all.
; With every autosave option in the Gameplay menu off (rest, wait, travel, entering or leaving an interior), the game
; still autosaves after each level-up and when a quest asks for a save: those two have no option in the menu. 1 = they
; follow the menu too: while all four options are off they are not made (so there is no automatic save to go back to
; after a level-up or at a quest's save point); with any option on, the game saves as before. 0 = the game's
; autosaves. Installed when the game starts if on, then live. Pull request #35 by Mishu117.
AutosaveFollowsMenu=0

; Off by default (0): MonitorNativeFromWindows above already fixes the wide-monitor bug; this one only adds choices.
; Fullscreen lists only the resolutions of the monitor's own shape and no wider than its native resolution.
; 1 = the fullscreen resolution list shows every mode Windows offers for the monitor (720 lines and up), not only
; those with the native shape; other shapes are stretched or letterboxed by the display or the graphics driver. Takes
; a restart.
FullscreenAllResolutions=0

; ###################################################################################################################
; PART 3 OF 3: OPTIONAL TWEAKS (may change the look or how the game plays; all off by default)
; ###################################################################################################################

; Not speed-ups and not game-bug fixes: switch one on only if you want its change. 0 = the game as it is.

; TRADE-OFF (off by default): walls, roofs and stairs of the open world use streamed ("virtual") textures: their detail
; is uploaded to the graphics card in small pages as the picture asks for it, and the game uploads at most 4 such pages
; per frame. After stepping outdoors into a wide new view (Imperial City Waterfront) that cap makes walls 40 m away come
; in blotchy and reach full detail seconds after the fade-in. With a value N (e.g. 64) N pages are uploaded per frame,
; and the walls are fully detailed as the fade completes. The settled picture is the same; detail arrives sooner, for
; more upload work per frame. No Engine.ini line can set this (the game's own graphics settings set it after every ini),
; so the fix sets it and sets it again if the game's settings put the 4 back. 0 = the game's value. Live.
VtStreamingUploads=0

; TRADE-OFF (off by default): 1.5 s into the fade-in after every door, city gate and fast travel the game empties its
; whole streamed ("virtual") texture cache (the console command r.VT.Flush): walls, roofs and stairs that were already
; sharp go blurry while the picture is still fading in and sharpen again over the next seconds (about 8 s with the game's
; upload rate, about 2 s with VtStreamingUploads=64). With 1 that flush is skipped and the textures loaded behind the
; loading screen stay. Why the game flushes is not known; in tests the settled picture was the same either way. If ground
; or walls ever look wrong after arriving and only fix themselves when you walk away, set 0. Takes a restart to switch
; on, then live.
FadeVtFlushSkip=0

; TRADE-OFF (off by default): when you go indoors the game lets the world run for a
; moment behind the loading screen, so your character already stands normally and the room is drawn when the picture
; comes in. When you step outside it does not: the world stays frozen until the fade-in has started, and you see your
; character settle. With a value N (milliseconds, e.g. 1000) exits work like entries: once the new area has loaded,
; the world is unfrozen and drawn behind the loading screen, which stays up until it has run N ms (at most 3 s more).
; City gates and fast travel are handled the same way. NPCs and creatures can act during that time, as they already
; do on entries. With 1000 the loading screen is about 1 s longer on exits, gates and fast travel (entries unchanged).
; Needs StreamBehindLoadingScreen; includes drawing the world behind the loading screen. Takes a restart to switch on, then live.
UnfreezeBehindLoadingScreen=0

; The same for fast travel and for loading a save, in milliseconds (0 = UnfreezeBehindLoadingScreen's
; value). After a fast travel or a save load the grass and textures need longer to fill in than after a door; e.g.
; UnfreezeBehindLoadingScreen=500 with this at 1000 gives fast travel and save loads 0.5 s more loading screen and leaves
; doors and gates as they are. Only while UnfreezeBehindLoadingScreen is on. Live.
UnfreezeBehindLoadingScreenFastTravel=0

; TRADE-OFF, off by default (it changes the HDR picture on purpose; nothing changes in SDR).
; In HDR the game copies its SDR picture as Windows decodes SDR (sRGB), so its shadows look raised and washed out next to SDR on a monitor (gamma 2.2). 1 = the
; HDR tone curve is recomputed in memory so darks and mid-tones have SDR-on-a-monitor's depth; highlights, peak, black
; floor and the HUD stay as they are. It works with frame generation. Re-done when you change an HDR setting. Live.
HdrGamma22=0

; TRADE-OFF, off by default (it changes the picture on purpose). The menu (inventory, map, System, ...) shows
; the world behind it from a picture taken as it opens. In HDR that picture holds HDR values that the menu shows as if
; they were SDR, so the background looks grey and washed out. 1 = the picture is converted so the background shows the
; world at the brightness it had (up to the menu's white, set by Paper White), as it does in SDR. HDR only. Takes a restart to switch on, then live.
HdrMenuBackground=0

; TRADE-OFF, off by default (it changes the picture on purpose). A save's thumbnail is the same kind of picture,
; so a save made in HDR shows a grey, washed-out thumbnail in the Load and Save menus. 1 = the picture is converted the
; same way before the save stores it. Saves already made keep their thumbnail. HDR only. Takes a restart to switch on, then live.
HdrSaveThumbnail=0

; Off by default (a menu addition). 1 adds an HDR section to the game's own Options > Graphics page, between General and
; Quality: HDR On/Off (default Off), Peak Brightness (nits, default 1000; set it to your display's peak), Paper White
; (nits: menus, subtitles and the HUD; default 200), Black Floor (-8 to -1, default -4 = 0.0001 nits; lower values
; darken the shadows, from about -6 the darkest ones turn black) and Mid-Tone (nits: the scene's overall brightness;
; default 15). They work and save like the game's other options. With HDR on, your saved peak brightness is also used
; from the start (the game used 1000 nits after every launch until you changed it), and paper white is 200 unless you
; saved another value. The four sliders are greyed out while HDR is off, and Brightness Intensity while HDR is on (it
; does nothing then), the way the game greys its own rows. If you had saved HDR options in the menu, the game's
; settings save is written once, after the game has saved its own settings at start-up, so they are kept. Takes a
; restart.
HdrMenuRows=0

; Off by default (a menu addition). 1 = a "HUD Aspect Ratio" row in the Graphics page's General section,
; after Frame Rate Limit: Wide (the default: the HUD uses the whole screen, as the game places it), 4:3, 16:9, 21:9 or
; 32:9. The other choices keep the HUD inside a centred area of that shape, e.g. 16:9 on an ultrawide; menus and
; full-screen effects (the low-health vignette) stay full width. A shape wider than your screen is the same as Wide.
; Saved with the other settings. Start-up only.
HudAspectRow=0

; TRADE-OFF, off by default (the row is added; Ray Reconstruction changes the picture only when you pick On). 1 = a "DLSS - Ray
; Reconstruction" row (Off / On) in the Graphics page's Advanced section, below DLSS - Frame Generation: NVIDIA's AI
; denoiser for ray-traced lighting and reflections, which the game's DLSS plugin has but the game never offers. Greyed out
; like the other DLSS rows when DLSS is not the upscaler. Needs NVIDIA's nvngx_dlssd.dll in the game's DLSS plugin folder
; (Engine\Plugins\Marketplace\nvidia\DLSS\DLSS\Binaries\ThirdParty\Win64; the game does not include it); without it the
; row is not added. It only acts on hardware ray tracing
; (Lumen Hardware RT on). Costs GPU time. Start-up only.
DlssRayReconstruction=0

; ===================================================================================================================
; Diagnostics (off by default; nothing you see or play changes)
; ===================================================================================================================

; Notes, for every slow frame of the game's main thread (HitchLedgerMs or longer), where its time went: loading, the old
; engine, physics, characters, rendering, the graphics card, menus. Written to OblivionPerfFix-ledger.csv next to this
; file (at most 48 MB; the previous session's file is kept as OblivionPerfFix-ledger.1.csv). tools\stutter_ledger.py
; ranks the causes. Useful when you report stutter. Costs well under a microsecond per frame. Start-up, then live.
HitchLedger=0
; A frame counts as slow from this many milliseconds (5-1000; 25 = one and a half frames at 60 fps).
HitchLedgerMs=25
; With HitchLedger=1: the game's main thread's per-frame "tick" work (characters, horses, physics parts, timers) split by
; what was updated (kind and class, for example SkeletalMeshComponent), every 2 seconds, plus the top three for each slow
; frame. Written to OblivionPerfFix-ticksplit.csv next to this file (about 0.3 MB a minute, at most 64 MB; the previous
; session's as .1.csv); tools\tick_split.py from the project's GitHub repository ranks it. For finding what makes a
; place slow (and for contributors). When on, it adds well under a microsecond per update (in a big crowd about 0.4 ms a
; frame); when 0 nothing is installed. Start-up, then live.
HitchLedgerTickSplit=0

[General]
; Write each fix's statistics to OblivionPerfFix.log every N seconds (0 = off). Includes a [mem] line: free RAM and
; commit, the game's memory and its video memory against the budget Windows gives it.
StatsIntervalSeconds=60

; 1 = write OblivionPerfFix.log next to this file at every start (the last two sessions are kept as OblivionPerfFix.1.log
; and .2.log; each file stops at 8 MB, so the three together are at most 24 MB; a normal hour writes about 0.3 MB).
; If that file can't be written, the log is OblivionPerfFix.<number>.log here or in %TEMP% and its first lines say why.
; 0 = write no log. Nothing is created, renamed or deleted at start-up. The one exception is a GPU crash report (see
; GpuCrashReport below): if the game crashes with "GPU crashed or D3D device removed", the log is created then and
; holds just that report. Logs from earlier sessions stay where they are: delete them yourself if you don't want them.
; Without a log we cannot see why a fix is off or what the game did, so switch it back on when you report a problem.
; Start-up only.
LogFile=1

; If the game crashes with "GPU crashed or D3D device removed" (a driver timeout, for example), write what the graphics
; card was doing to OblivionPerfFix.log first: which of the game's render passes each command list had reached
; (Windows' DRED data, which the game collects but does not save), whether it was a memory page fault, and the memory
; use of the last minute (video memory against its budget, free RAM and commit, frame times, one line per second), and
; the settings below in effect. It names no other program. Please include that part of the log when you report such a
; crash. Start-up only.
GpuCrashReport=1

; Render pass names for that report. Without them the game's DRED data says only which command list the graphics card
; stopped in, not which pass. 1 = pass names in DRED; 2 = AMD's own markers (AMD's Radeon GPU Detective and Radeon GPU
; Profiler then show the passes); 3 = both; 0 = off. Only on AMD graphics cards (the game sends its pass names through
; AMD's marker interface only; elsewhere nothing changes). Nothing is drawn differently; the cost is a little CPU time on
; the threads that record the GPU's work. Read at start-up (0 there: not installed), then live.
GpuPassMarkers=0
