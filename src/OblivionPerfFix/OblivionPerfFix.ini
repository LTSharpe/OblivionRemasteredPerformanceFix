; OblivionPerfFix settings: 1 = on, 0 = off. Everything is on by default, and you don't need to change anything.
;
; Every fix does the game's own work in a cheaper way: what you see and what happens in the game stay the same. The
; only differences are a matter of timing: NpcCreationPacing builds far-away characters a few frames later, and
; CellBufferPacedEvict unloads the cells behind you a few frames later. Both are explained below.
;
; Each fix checks the game's code before it changes anything. If the code is not what it expects (after a game update,
; for example), that fix stays off and OblivionPerfFix.log says so. The log lists every fix at start-up.
;
; On CPUs with fewer than 8 logical processors, ParallelStaticBodies (with PipelinedBodyCreation), PhysicsPushParallel,
; AnimTeardownParallel and the automatic mode of RdgParallelTranslate stay off, and the log says so: they rely on helper
; threads and were only tested with 16.
;
; "Live" below means you can switch the fix on and off while the game runs (the file is read again every second).
; "Start-up" means it is installed when the game starts: switch it on before starting the game; once installed it can
; be switched off and on live.
;
; How each fix works, in plain words: docs/how-it-works.md on the project page.

[Fixes]

; ===================================================================================================================
; Rendering: the CPU side of drawing each frame
; ===================================================================================================================

; Character skeletons (about 7,200 bones a frame) were copied to the graphics card with an instruction that is very
; slow for that kind of memory. This uses a plain copy that writes the same bytes. Start-up only.
BoneUploadStores=1

; The weather and time-of-day system told the engine to rebuild the sun, moon, fog, sky and sky light every frame, even
; when none of their values had changed. This rebuilds them only when something changed. Start-up, then live.
AtmosphereDirtyFilter=1

; When only a light's brightness, colour or temperature changes (sunrise, sunset, weather blends), update it the way the
; engine's own setters do instead of rebuilding it. Needs AtmosphereDirtyFilter. Live.
AtmosphereLightFastPath=1

; The same for the sun's and moon's cloud shadow and cloud brightness values, which the weather moves a little every few
; frames: the new values go straight to the light the renderer draws. Needs AtmosphereLightFastPath. Live.
AtmosphereLightCloudPath=1

; Translate each frame's drawing work into DirectX 12 commands on all CPU cores instead of on one thread, as Unreal
; Engine 5.5 does by default. The biggest gain where the CPU limits your frame rate. Uses 0.4-1 GB more video memory.
; 2 = automatic: on, except on graphics cards with less than 9.5 GB of video memory (8 GB cards), where video memory is
; the limit and this made travelling less smooth in our tests. 1 = always on, 0 = off. Live.
RdgParallelTranslate=2

; With RdgParallelTranslate the frame reaches the graphics card in about 100 small pieces, each with a small cost. This
; hands over up to this many pieces at once, in the same order (the engine's own batching). 0 = off. Start-up, then live.
RdgSubmitBatch=32

; When a big area streams in (a wood, a rock field), the positions of its new objects are written into the graphics
; card's scene data. Unreal splits that into batches but ran them one after another on one helper thread, and the frame
; waited for it (up to about 50 ms). This runs them on all helper threads (Unreal's own r.GPUScene.ParallelUpdate, on by
; default in later versions). Each batch writes its own part, so the result is identical. Live.
GpuSceneParallelUpload=1

; Robes, capes and banners copied their whole cloth simulation setup every frame, although it almost never changes. This
; skips the copy when it would come out identical. Start-up, then live.
ClothConfigCache=1

; ===================================================================================================================
; Travelling: memory that was handed back and requested again every time the world streams in or out
; ===================================================================================================================

; Lumen (the game's lighting) keeps a list of every object it lights. When an area streamed out, the game shrank the
; list, copying it to new memory, and grew it again with another full copy when the next area came in (25-40 ms each
; time). This keeps the list's memory (only what it already needed at its largest). Start-up, then live.
LumenKeepArrayCapacity=1

; Textures and meshes reach the graphics card through "upload" memory, which the game handed back to Windows after each
; streaming burst and requested again seconds later (up to 30 ms per block). This keeps it for the session. Costs a
; little system memory (0.1-0.5 GB), not growing over time. Start-up, then live.
UploadMemoryKeep=1

; The graphics card's list of every object, tree and grass instance in view (100-250 MB in a forest) was re-made with a
; fresh block of memory each time its size crossed a power of two, in either direction (about 100 ms). This keeps its
; size when the count drops by one step and only shrinks it at a quarter. Live.
GpuSceneKeepCapacity=1

; Clearing a big patch of grass or plants built its list of "hide" orders a little at a time, so the list was copied
; about 30 times in one frame (about 20 ms). This makes room for the whole list once. Start-up, then live.
InstanceClearReserve=1

; The game's memory manager handed blocks back to Windows and asked for new ones about 1,700 times a second in a town;
; each new block costs a page fault on every first write. This keeps up to 64 MB of returned blocks and hands them out
; again for the same size. Unused blocks go back to Windows after 5 seconds, and at once while Windows is short of
; memory (see MemoryRelief). Start-up, then live.
OsPageCache=1

; While the world streams in, the game builds the map its characters walk on (the navigation mesh) in the background,
; tile by tile. A thread that was waiting for something else could pick up such a tile while the frame waited for that
; thread (up to about 100 ms). This leaves the tiles to free threads (the engine's own flag for that). Live.
NavmeshBuildNoBusyWait=1

; The engine's check behind NavmeshBuildNoBusyWait has a gap: a waiting thread that puts one such tile back can take the
; next one without checking it (0.1-2.5 s waits seen over the Imperial City). This closes the gap. Live.
BusyWaitFlagCheck=1

; ===================================================================================================================
; Travelling: physics, when a new area arrives
; ===================================================================================================================

; The physics engine keeps a search tree of every solid object. When a whole new area arrived at once it rebuilt the
; tree in one go while the game waited (about 30 ms). This spreads those rebuilds over a few frames like the small ones,
; and lets each step do more of the work in the background while a rebuild has a backlog. Collisions find exactly the
; same objects meanwhile. Live.
PhysicsTreeTimeSlicing=1

; When a rebuild finishes, the objects that arrived meanwhile are added to the tree's two copies (one for physics, one
; for the game's own checks). This fills both copies at the same time on two threads. Live.
PhysicsFlushParallel=1

; Woods and rocky slopes are made of "instanced" meshes; each tree or rock gets its own collision body when the area
; streams in, a few hundred at once on the game's main thread (about 170 ms over a few seconds below Kvatch's north
; cliff). This makes those bodies on a few helper threads with the game's own code and hands them to the physics world
; in the game's order. Start-up, then live.
ParallelStaticBodies=1

; Hands each group of 64 bodies to the physics world while the helper threads are still making the next ones, instead
; of waiting for all of them. The same bodies in the same order, in the same frame. Needs ParallelStaticBodies. Live.
PipelinedBodyCreation=1

; New collision first goes into a small "recent changes" search tree until the next background rebuild. The game picked
; each new entry's place with a thorough search over the whole tree; this uses the usual quick rule. The same entries
; with the same sizes, so every collision test finds the same things; only the tree's shape differs, which the game
; itself already varies from run to run, and only until the next rebuild. Start-up, then live.
DirtyTreeQuickInsert=1

; Files a whole batch of such new entries as one branch of that tree, arranged into a balanced shape at the end of the
; batch, instead of one entry at a time with a pass up the whole tree for each. Same entries, same sizes (the shape
; differs as above). Start-up, then live.
BulkIndexInsert=1

; In a physics step that swaps in a rebuilt search tree, two catch-up passes that work on different trees ran one after
; the other; this runs them side by side. Same results. Start-up, then live.
PhysicsInternalFlushParallel=1

; When a forest or a town streams in, the physics side takes in thousands of new bodies one at a time on one thread.
; This creates each batch in one go and sets up their shapes on a few helper threads, filed in the same order.
; 1 = on, 2 = batch creation only, 0 = off. Start-up, then live.
PhysicsPushParallel=1

; When the main thread takes over the physics side's newest search tree, it works through its list of collision
; changes; the game shrank and copied that list after every ~228 entries (dozens of copies when a forest streams in).
; This shrinks it once, at the end. The same changes in the same order. Start-up, then live.
PhysicsQueueShrinkOnce=1

; ===================================================================================================================
; Travelling: characters
; ===================================================================================================================

; Every character that appears (arriving in a town, stepping out of a door) fades in over about a second. During the fade
; the game rebuilt every piece of that character for the graphics card on every frame (body, clothes and equipment, each
; with a new ray tracing copy). Where many characters appear at once, as on Anvil's docks, that took more than a gigabyte
; of extra video memory, and when it went over the card's budget the game froze for seconds. This sends just the changed
; fade value to the graphics card, the way the engine updates other per-object values. The fade looks the same.
; Start-up, then live.
NpcFadeInNoRebuild=1

; When a new strip of land loads, the game created every character in it at once (a shrine with five worshippers:
; clothes, hair, weapons, animation) in one or two frames: 50-100 ms hitches. This builds the far-away ones (more than a
; cell from you, and out of sight) a piece per frame, so they are complete a few frames later out there. Anyone near
; you, and everything during loading screens and menus, is created exactly as before, in the same order; nothing is
; skipped. While a character waits, the game's updates behind it wait too (usually a few frames, never more than 30),
; as they would during the long frame it replaces. If you ever see the game freeze while travelling, set this to 0 and
; please report it. Start-up, then live.
NpcCreationPacing=1

; Every ~4,100 units of travel the old engine unloads the cells behind you, and the game waits for it: the short hitch
; when you cross open country. Much of that is the animation data of the characters left behind, taken apart piece by
; piece on one thread. This hands those pieces to four helper threads (with the game's own code); every piece of a
; character is gone before the game goes on, as before. Only pieces the fix has recognised are handed over; anything
; else is taken apart as the game does it. Start-up, then live.
AnimTeardownParallel=1

; The cells that fall out of the old engine's "recently visited" cell buffer at such a crossing were all unloaded inside
; the crossing frame (5-20 ms at Kvatch). This gives the buffer a few spare slots (as a bigger uExterior Cell Buffer in
; Oblivion.ini would) and unloads those cells one per frame over the next few frames, oldest first, with the game's own
; unload. After about a tenth of a second the buffer is as the game would have it. Doors, fast travel and loading a save
; unload them at once, as before. The game writes Oblivion.ini when it quits; your own value is written back, so the
; spare slots are never saved. Start-up, then live.
CellBufferPacedEvict=1

; ===================================================================================================================
; Doors, loading screens and start-up
; ===================================================================================================================

; After a door, city gate or fast travel the picture came back with one long frame: while the world is frozen behind
; the loading screen, the physics engine is not told about the thousands of objects the new area added, so the first
; frame afterwards takes them all in at once. This hands them to the physics engine while the loading screen is still
; up, the way the engine's own "flush" does it. Nothing is simulated meanwhile (nothing moves, collides or wakes up), and
; the world, the fade-in and your controls start exactly when they did before. Start-up, then live.
PrepareCollisionBehindLoadingScreen=1

; After every start the game builds about 18,000 graphics pipelines (shader combinations) in the background at a slow
; pace, for two to three minutes: through the main menu and your first minutes of play, holding every loading screen up
; to 5 seconds longer. This lets it run at the engine's own fast pace while you are not playing (start-up videos, main
; menu, loading screens, menus) and gives the game's slow pace back the moment you play. The same pipelines are built.
; Start-up, then live.
PsoPrecompileFast=1

; ===================================================================================================================
; Menus
; ===================================================================================================================

; Opening the menu on the Graphics page froze the game for about a fifth of a second (more with several monitors): the
; page asked Windows for every display mode of every monitor, eight times over. This keeps each monitor's list and
; checks at every rebuild that Windows still reports the same modes (otherwise it reads them again). Start-up, then live.
DisplayModeCache=1

; Every time a menu opens, the game takes a picture of the screen and runs it through a slow filter one pixel at a
; time (about 0.15 s at 4K). This computes the same picture, byte for byte, about 40 times faster. Start-up, then live.
MenuScreenshotFilter=1

; The same picture is first read back from the graphics card and turned into 8-bit colour one pixel at a time (about
; 45 ms at 4K). This computes the same colours, byte for byte, about ten times faster. 2 = on, and checks itself against
; the game's own code on every picture (slower; for testing). Start-up, then live.
ScreenshotReadbackConvert=1

; What is left of that picture's cost is copying it: six copies of 33 MB at 4K, each on one thread. This spreads them
; (and the two fixes above) over a few helper threads and skips one fill with zeros that is overwritten anyway. The same
; picture, byte for byte. Start-up, then live.
ScreenshotParallel=1

; ===================================================================================================================
; Frame generation (FSR 3 frame generation, and AMD's ML frame generation on Radeon RX 9000)
; ===================================================================================================================

; With frame generation on, the game computed each generated frame on the graphics card in a line with its own frames,
; and the card kept waiting: in Cheydinhal at 4K the rendered frame rate fell by 20-25 %. AMD's plugin has a setting that
; runs that work on a second queue of the card, beside the next frame (r.FidelityFX.FI.AllowAsyncWorkloads); the game
; leaves it off. This switches it on: +22-29 % rendered fps there, the same images and frame pacing. An
; r.FidelityFX.FI.AllowAsyncWorkloads line in your own Engine.ini still wins. Start-up only.
FrameGenAsyncCompute=1

; Only with AMD's newer FSR DLL (see "AMD ML frame generation" in the README; the game's own FSR 3.1.0 DLL has no such
; setting, so this then does nothing). AMD's frame generation spaces the frames out by a target it works out from the
; last frames; after a few long frames (arriving in a new area) that target stays too long for seconds. AMD documents
; this and recommends tuning sets: 1 = Tuning Set B (AMD's recommendation for this case), 2 = Set A, 0 = AMD's default.
; Only when frames are shown changes, not what is drawn. Live.
FrameGenPacingTuning=1

; Only matters with AMD's newer FSR DLL on a Radeon RX 9000 (see "AMD ML frame generation" in the README): AMD's ML frame
; generation also needs the camera's position and direction, which the game's FSR 3.1.0 code never sends. This sends
; each frame's camera along, the way AMD's own newer Unreal plugin does. With the game's own DLL nothing reads it.
; Start-up, then live.
FrameGenCameraInfo=1

; ===================================================================================================================
; Crash and bug fixes in the game, its engine and AMD's library (not speed-ups)
; ===================================================================================================================

; The game keeps a list of names (places, sounds, quests) that some of its systems look up, for example the sound of an
; object hitting the ground. After every start or load, thousands of its entries point at memory the game has already
; freed, and a lookup crashes if Windows has taken that memory back by then (seen after several games in one session).
; Such an entry is now skipped, which is what already happens whenever that memory still exists. Start-up, then live.
NameLookupCrashGuard=1

; A trap (falling rocks, a swinging log, spikes) keeps a list of the characters it is touching. When a character in that
; list is removed from the game (seen at the Kvatch Oblivion gate), the game can forget to take it off the list, and the
; next physics step crashes. Such a character is now taken off the list, as the game does when a character steps away
; from a trap. Traps still hit and push everyone who is there. Start-up, then live.
TrapCrashGuard=1

; In big fights the game's old engine can pop up a leftover debug box, "42 Havok picks (6 path, 36 LOS, 0 ViewCaster) used
; this frame.", on its own thread, and the whole game stands still (often hidden behind the game window) until someone
; closes it. The box only reports that the engine skipped some sight and path checks that frame, which it does with or
; without the box (its limit, iMaxPicks in Oblivion.ini, is not changed). The box is now written to this log instead.
; Start-up, then live.
HavokPickWarningGuard=1

; A rare crash in the game's engine (Unreal Engine bug UE-217692, fixed by Epic in a later version): a "view" of a
; buffer created at the very moment the engine moves that buffer in video memory keeps pointing at the old place, and
; the game crashes when it uses it. Creating the view and moving the buffer now wait for each other, and such a view is
; corrected on the spot. With this on, RdgParallelTranslate no longer has to pause that tidying, which saves about
; 0.2 GB of video memory. Start-up, then live.
ViewRenameGuard=1

; A crash in AMD's FidelityFX library (frame generation): it keeps 8 command lists per GPU queue and crashed instead of
; waiting when the graphics card was still busy with all 8 (a long stall, for example at 4K with video memory full).
; Now the game waits for the card to finish one (a few milliseconds, 3 seconds at most). Nothing changes while the card
; keeps up. Works with the game's FSR 3.1.0 DLL and with AMD's 3.1.4 DLL. Start-up, then live.
FrameGenCrashGuard=1

; A game bug: after an alt-tab, FSR and frame generation often stayed off (native resolution, lower frame rate) until
; you changed the upscaler in the settings. The game switches FSR off while its window is in the background and on
; again when you come back, but only if it thinks no menu is open, and once you have used the inventory, map or wait
; menu it keeps thinking one is. This switches FSR back on, the way the game does, as soon as no menu is open. If you
; chose another upscaler meanwhile, that choice stays. Start-up, then live.
RestoreFsrAfterAltTab=1

; A game bug: a robe, tabard or cape could stretch into a long strip back to where its wearer had been. It happens when a
; character whose cloth is frozen (not simulating, for example out of sight) is moved and its cloth then switches level
; of detail: the game moved the cloth only part of the way. This moves it all the way, with the engine's own "teleport"
; for that cloth. Cloth that is simulating is not affected. Start-up, then live.
FrozenClothStretchFix=1

; ===================================================================================================================
; Memory safety
; ===================================================================================================================

; Some fixes above keep memory on purpose (UploadMemoryKeep, LumenKeepArrayCapacity, OsPageCache: up to about 0.5 GB of
; RAM). When Windows has less than 1 GB of RAM left for 3 seconds, or less than 1 GB of commit (RAM plus page file),
; they behave as the game does until there is twice that free again for a minute. Each change is logged. No fix is
; switched off for video memory: going over it moves memory to system RAM, which costs speed but does not crash the
; game (CommandAllocatorTrim gives back what the game no longer needs instead). Live.
MemoryRelief=1

; Every batch of work sent to the graphics card needs its own block of video memory, and the game keeps every block it
; ever needed at once, for the whole session: after loading an area about 400 of them, around 0.4 GB (the stock game
; too). When the game gets within about 2 GB of the video memory Windows gives it, this hands the spare ones back, a few
; at a time, about 20 seconds after a load. Anything needed again is made anew, as when the game's stock runs out. On a
; card with plenty of memory to spare it does nothing. Live.
CommandAllocatorTrim=1

; ===================================================================================================================
; Diagnostics (off by default; nothing you see or play changes)
; ===================================================================================================================

; Notes, for every slow frame of the game's main thread (HitchLedgerMs or longer), where its time went: loading, the old
; engine, physics, characters, rendering, the graphics card, menus. Written to OblivionPerfFix-ledger.csv next to this
; file (at most 48 MB; the previous session's file is kept as OblivionPerfFix-ledger.1.csv). tools\stutter_ledger.py
; ranks the causes. Useful when you report stutter. Costs well under a microsecond per frame. Start-up, then live.
HitchLedger=0
; A frame counts as slow from this many milliseconds (5-1000; 25 = one and a half frames at 60 fps).
HitchLedgerMs=25

[General]
; Write each fix's statistics to OblivionPerfFix.log every N seconds (0 = off). Includes a [mem] line: free RAM and
; commit, the game's memory and its video memory against the budget Windows gives it.
StatsIntervalSeconds=60

; If the game crashes with "GPU crashed or D3D device removed" (a driver timeout, for example), write what the graphics
; card was doing to OblivionPerfFix.log first: which of the game's render passes each command list had reached
; (Windows' DRED data, which the game collects but does not save), whether it was a memory page fault, and the memory
; use of the last 30 seconds. Please include that part of the log when you report such a crash. Start-up only.
GpuCrashReport=1
